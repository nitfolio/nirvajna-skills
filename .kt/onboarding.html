# Onboarding — `claude-skills-repo`

## What this system is

`claude-skills-repo` is a distribution repo for **Claude Code skills** — reusable prompt artifacts,
not software. A skill is a self-contained folder holding a `SKILL.md` plus optional `references/`,
which Claude Code loads into its context when a user's situation matches the skill's description.
There is no build, no runtime, no dependencies: the markdown *is* the product, and the "deploy" is
`cp -r` into a skills directory.

The repo ships exactly one skill today, `codebase-onboarding` — a guided, evidence-based knowledge
transfer procedure for unfamiliar codebases. It explores a repo one stage at a time, tags every
claim with the evidence behind it, keeps an honest map of what it still doesn't know, and leaves a
resumable `.kt/` trail plus a curated onboarding document behind. Twelve tracked files, 1,683 lines
of text, one author.

## Architecture map

The entire design is one idea — **progressive disclosure**. `SKILL.md` is loaded for the whole run,
so it must stay lean; anything only *some* runs need lives in `references/` and is read on demand.
Every file boundary in the repo follows from that constraint.

```mermaid
graph TD
    FM["SKILL.md frontmatter<br/>(name + description)"] -->|description matches situation| BODY["SKILL.md body — 347 L<br/>ALWAYS IN CONTEXT"]
    BODY -->|"Stage 1: after classifying the repo"| PB["references/repo-playbooks.md<br/>14 playbooks"]
    BODY -->|"on stop / end of speedrun"| SYN["references/synthesis.md"]
    SYN -->|"step 4"| TPL["references/study-page-template.html"]
    BODY -->|every turn| P[".kt/00-progress.md"]
    BODY -->|as stages complete| T[".kt/01–07"]
    SYN -->|at the end| D[".kt/08-onboarding.md"]
    TPL -->|00–08 pasted verbatim| H[".kt/onboarding.html"]
    RM["README.md ×2"] -.->|humans only, never loaded| BODY
```

Coupling is textual, not structural: one document instructs the agent to read another at a named
moment. Both `README.md` files are for humans on GitHub — no instruction file ever reads them.

## Domain glossary

| Term | Meaning | Where |
|---|---|---|
| **Skill** | Self-contained folder Claude Code loads when relevant | `README.md:27-29` |
| **Fog of war** | Governing metaphor — the unlit map matters as much as the lit part | `SKILL.md:20-24` |
| **The core loop** | DISCOVER → EXPLAIN → ASSESS → PROPOSE → CONFIRM, one per turn | `SKILL.md:47-56` |
| **Evidence tag** | `[fact]` / `[inference]` / `[unknown]` / `[human]` on every non-obvious claim | `SKILL.md:68-84` |
| **The ladder** | 7 stages: Orientation → Architecture → Domain → Flows → Dependencies → Operations → Contribution | `SKILL.md:150-180` |
| **"Done when"** | Checkable completion criterion; a stage can't be declared done without it | `SKILL.md:154-158` |
| **Playbook** | One of 13 repo-type adaptations of the ladder, + a generic fallback | `references/repo-playbooks.md:32-360` |
| **The `.kt/` trail** | `00`–`07`: raw, evidence-tagged working record, deliberately unpolished | `SKILL.md:190-215` |
| **The deliverable** | `08-onboarding.md` — curated, written only at `stop` | `references/synthesis.md:1-43` |
| **Coverage check** | Guard that refuses to polish a barely-explored repo | `references/synthesis.md:6-14` |
| **Confidence filter** | Promote `[fact]`/`[human]`, drop guesses, carry unknowns into a named section | `references/synthesis.md:16-26` |
| **`speedrun`** | A standing `continue` — full ladder, no gates, unchanged rigor | `SKILL.md:271-302` |

The evidence tag is the atomic unit: coverage check, confidence filter, and the fog map are all
downstream of it.

## Key flow — a session, end to end

1. **Trigger.** Claude Code matches the user's situation against the frontmatter `description`
   (`SKILL.md:2-10`). That description is the *only* trigger mechanism (`README.md:110-112`), which
   is why it's written as a list of situations rather than a feature summary.
2. **Load.** The body (`SKILL.md:12-347`) enters context. `references/` do not.
3. **Ask the goal, once** (`SKILL.md:30-45`), then announce `.kt/` and begin.
4. **Stage 1, Orientation** runs the core loop (`SKILL.md:47-56`) using the tool list at
   `SKILL.md:92-112`, and must satisfy its criterion at `SKILL.md:160-162`.
5. **Branch on repo type** → read `references/repo-playbooks.md` (`SKILL.md:182-188`). First lazy load.
6. **Write the trail**, rewrite `00-progress.md`, then **stop and wait** — one proposal, two or
   three controls (`SKILL.md:267-269`).
7. **Stages 2-7** repeat, one per `continue`.
8. **`stop`** → read `references/synthesis.md`; run the coverage check (`:6-14`) and confidence
   filter (`:16-26`); write `08-onboarding.md` in the shape at `:33-41`; copy the template to
   `.kt/onboarding.html` and paste each trail file verbatim into its matching
   `<script type="text/markdown">` slot (`study-page-template.html:170-204`), deleting slots for
   files that don't exist.

The template is the repo's only executable code: a hand-rolled markdown renderer
(`study-page-template.html:222`), filter-driven nav, scroll-spy, and copy buttons with a
`<textarea>` fallback — no CDN, no library, opens offline from disk.

## Your first change

**Start here (zero behavioural risk):** `codebase-onboarding/README.md:62` still tells users to
upload `codebase-onboarding.skill`. That file was deleted in commit `9a77940`, and commit `ce43ad1`
fixed the *root* README's wording but missed this one. Mirror the correct phrasing from
`README.md:81-83`. Human-facing docs only — the agent never reads this file.

**Next tier (additive):** add a 15th repo-type playbook. Copy an existing one, keep the five-part
shape, then update the Contents list at `repo-playbooks.md:13-31` **and** the two hardcoded "13
repo-type playbooks" strings (`README.md:100`, `codebase-onboarding/README.md:344`).

**Treat `SKILL.md` as the high-risk file.** Every line is loaded for every run, and the frontmatter
`description` is the single highest-blast-radius string in the repo — weaken it and the skill stops
triggering with no error anywhere.

Verify like this — there is no test suite:

```bash
cp -r codebase-onboarding ~/.claude/skills/
diff -r codebase-onboarding ~/.claude/skills/codebase-onboarding   # must print nothing
# restart Claude Code, then:
#   "what skills do you have available?"   → codebase-onboarding listed
#   "walk me through this repo"            → triggers WITHOUT being named  ← the check that matters
#   /codebase-onboarding                   → one stage, then it STOPS and waits
#   /codebase-onboarding speedrun          → full ladder + 08-onboarding.md + onboarding.html
rm -rf .kt   # gitignored (.gitignore:2); safe to delete and re-run
```

The unnamed-trigger check is the important one. A change tested only via the explicit
`/codebase-onboarding` invocation will never catch a broken `description`.

## Assumptions & things to verify

- **The goal was assumed, not stated.** This run was launched as `speedrun` with no stated purpose,
  so it used the default "just understand it" framing. A bug-fix or due-diligence goal would have
  weighted the ladder differently.
- **Repo-type classification is soft.** This is a content/prompt repo, which matches none of the 13
  playbooks; the generic fallback (`repo-playbooks.md:347`) was used, with "state" read as *the
  artifacts a run writes* and "boundaries" as *the host agent runtime*.
- **No code was executed.** Per the read-only rule, nothing was run. In particular the study page's
  markdown renderer was *read*, not tested — its behaviour on real trail markdown is inferred from
  the source. The `onboarding.html` this run produced is the first opportunity to confirm it.
- **[unknown] Does the Claude.ai / Cowork upload path work?** The handling for read-only mounts, a
  missing `.git/`, and a relocated `.kt/` is written (`SKILL.md:118-121`) but nothing in the repo
  shows it was ever exercised.
- **[unknown] Is the missing mermaid ladder a dropped edit?** HEAD (`6e83541`) is a `wip:` commit
  titled "brand hero, badges, mermaid ladder", but `README.md` contains no mermaid block.
- **[unknown] Is a `.skill` bundle published outside the repo** (e.g. as a release asset)? If so,
  `codebase-onboarding/README.md:62` is correct and the finding above is wrong.
- **[unknown] Are more skills planned?** The repo name is plural and the README's table and
  contribution rules are built for many, but it ships one.
- **Cross-file contracts are unenforced.** The `.kt/` filenames appear in `SKILL.md:194-205`,
  `synthesis.md:52-53`, and as `data-id` slots in `study-page-template.html:170-204`; the playbook
  count appears in three places. Nothing checks any of it — there is no CI, linter, or test.

# 01 · Overview

## What this system is

**[fact]** `claude-skills-repo` is a **distribution repo for Claude Code skills** — a curated

"Skills that make Claude Code do the tedious part properly."

**[fact]** It contains **zero executable source code**. All 12 tracked files (`git ls-files`) are
markdown, one HTML template, four PNGs, a LICENSE, and a `.gitignore`. Total 1,683 lines of text
across the 5 content files.

**[fact]** There is exactly **one skill** in the repo today: `codebase-onboarding/`. The README
badge at `README.md:14` hardcodes `Skills-1`.

## Stack

**[fact]** No stack in the usual sense — no package manifest (`package.json`, `pyproject.toml`,

no Dockerfile. `README.md:29` says this explicitly: "No plugin, no config, no runtime."

**[fact]** The only code in the repo is inside `codebase-onboarding/references/study-page-template.html`
— vanilla browser JavaScript, no external libraries (`study-page-template.html:206-352`).

## Entry points

Because the "runtime" is Claude Code itself, entry points are load points, not `main()`s:

- **[fact]** `codebase-onboarding/SKILL.md:1-11` — YAML frontmatter (`name`, `description`). This is
  the true entry point: Claude Code reads the `description` to decide whether to load the skill.
- **[fact]** `codebase-onboarding/SKILL.md:12+` — the skill body, loaded into context on trigger.
- **[fact]** `codebase-onboarding/references/*` — loaded lazily, only when the skill body says to
  read them.
- **[fact]** `README.md:60-66` — the human entry point: `cp -r codebase-onboarding ~/.claude/skills/`.

## Repo type

**[inference]** Closest match is **playbook 14, generic fallback** (`references/repo-playbooks.md:347`)
— a content/prompt repo fits none of the 13 named types. Classification is therefore **soft**; the
ladder was adapted, with "state" read as *the artifacts a run writes* and "boundaries" read as *the
host agent runtime*.

**[fact]** This is a **self-referential KT**: the skill being explored is the same skill running the
exploration. The installed copy at `~/.claude/skills/codebase-onboarding` is **byte-identical** to
the repo copy (verified with `diff -r`, no differences).

# 02 · Architecture

## The organizing principle: progressive disclosure

**[fact]** The whole architecture is one idea, stated at `README.md:114-116`: `SKILL.md` stays lean
enough to hold in context for an entire run, and heavy material lives in `references/`, "loaded *on
demand*". The README calls this "the main reason a large skill stays reliable."

That single constraint explains every file boundary in the repo.

## Module map

```
claude-skills-repo/
├── README.md          ← repo-level marketing + install + contribution rules (146 lines)
├── LICENSE            ← MIT
├── .gitignore         ← 2 lines; ignores .kt/ (the skill's own output)
├── assets/            ← 4 PNGs: light/dark logo + wordmark, used only by README.md
└── codebase-onboarding/          ← the one skill (a self-contained unit)
    ├── SKILL.md       (347 L)    ← ALWAYS loaded: frontmatter + method
    ├── README.md      (396 L)    ← human docs; never loaded by the agent
    └── references/               ← loaded on demand, one read away
        ├── repo-playbooks.md         (360 L) ← 14 playbooks
        ├── synthesis.md              ( 64 L) ← the `stop` procedure
        └── study-page-template.html  (368 L) ← HTML shell for the deliverable
```

**[fact]** Every top-level path is accounted for above — nothing is unexplored.

## Load tiers (how the pieces talk)

There are no imports or function calls. The coupling is **textual**: one document instructs the
agent to read another at a named moment.

```mermaid
graph TD
    FM["SKILL.md frontmatter<br/>(name + description)"] -->|description matches situation| BODY["SKILL.md body<br/>ALWAYS IN CONTEXT"]
    BODY -->|"Stage 1: after classifying repo type"| PB["references/repo-playbooks.md"]
    BODY -->|"on `stop` / end of speedrun"| SYN["references/synthesis.md"]
    SYN -->|"step 4: copy the shell"| TPL["references/study-page-template.html"]
    BODY -->|writes every turn| KT[".kt/00-progress.md"]
    BODY -->|writes as stages complete| KT7[".kt/01-07"]
    SYN -->|writes at the end| KT8[".kt/08-onboarding.md"]
    TPL -->|filled with 00-08 verbatim| HTML[".kt/onboarding.html"]
    RM["README.md (repo)"] -.->|humans only, never loaded| BODY
    SRM["codebase-onboarding/README.md"] -.->|humans only| BODY
```

**[fact]** The two read-triggers are explicit in the text:
- `SKILL.md:~"Detect the repo type first"` — "read `references/repo-playbooks.md` and follow the
  matching playbook".
- `SKILL.md` (Finishing section) — "Before writing a word of it, **read
  `references/synthesis.md`**".
- `synthesis.md:51` — "Copy `references/study-page-template.html` to `.kt/onboarding.html`."

**[fact]** `study-page-template.html` is reached **only transitively**, via `synthesis.md`. Nothing
in `SKILL.md` reads it directly.

**[inference]** The two `README.md` files are pure dead weight from the agent's perspective — never
referenced by any instruction file. Their audience is a human browsing GitHub. That's deliberate
separation, not an oversight: `README.md:129` tells contributors to "Add a `README.md` for humans."

## The dominant style

**[inference]** Declarative-procedural prose with **checkable postconditions**. The signature
pattern is the "*Done when:*" clause attached to each of the 7 ladder stages in `SKILL.md`.
`README.md:127-128` names this as the repo's core convention: "Give any multi-stage process a
checkable **'done when'** condition per stage — vague criteria are the single most common reason a
skill stops early."

**[inference]** The second recurring style is **anti-pattern naming** — nearly every rule states the
failure mode it prevents ("A speedrun that quietly lowers the bar to go faster has missed the
point"). The instructions are written to survive an agent that wants to shortcut them.
</script>

<script type="text/markdown" data-id="03-domain-glossary" data-label="03 · Domain glossary" data-group="trail">
# 03 · Domain glossary

The domain is *knowledge transfer as a procedure*. Terms are load-bearing — the skill's rules refer
to them constantly.

| Term | One-line meaning | Where it lives |
|---|---|---|
| **Skill** | Self-contained folder (`SKILL.md` + optional `references/`) that Claude Code loads when the situation matches | `README.md:27-29` |
| **KT** | Knowledge transfer — one guided onboarding session over an unfamiliar repo | `SKILL.md:1-15` |
| **Fog of war** | The governing metaphor: the unlit part of the map is as valuable as the lit part; hiding it is the failure mode | `SKILL.md:20-24` |
| **The core loop** | DISCOVER → EXPLAIN → ASSESS → PROPOSE → CONFIRM; exactly one per turn | `SKILL.md:47-56` |
| **Evidence tag** | `[fact]` / `[inference]` / `[unknown]` / `[human]` — mandatory label on every non-obvious claim | `SKILL.md:68-84` |
| **`[human]`** | A claim the engineer supplied — explicitly the *strongest* evidence class, outranking `[fact]` | `SKILL.md:78-81` |
| **The ladder** | The 7 ordered stages: Orientation → Architecture → Domain → Key flows → Dependencies → Operations → Safe contribution | `SKILL.md:150-180` |
| **"Done when"** | Per-stage checkable completion criterion; a stage may not be declared complete without it | `SKILL.md:154-158` |
| **Zone of proximal development** | Rule for picking the next step: just beyond current knowledge and reachable from it — not the most interesting thing found | `SKILL.md:58-63` |
| **Repo type / playbook** | One of 13 classifications (+ generic fallback) that reorders the ladder for the repo at hand | `references/repo-playbooks.md:32-360` |
| **The `.kt/` trail** | `00`–`07`: the raw, evidence-tagged working record. Deliberately left unpolished | `SKILL.md:190-215` |
| **`00-progress.md`** | The trail's source of truth; updated *every* turn; what makes a session resumable | `SKILL.md:~225` |
| **The deliverable** | `08-onboarding.md` — the curated reader-facing doc, written **only** at `stop` | `references/synthesis.md:1-43` |
| **Study page** | `.kt/onboarding.html` — self-contained offline page bundling `00`–`08`, built from the template | `references/synthesis.md:45-64` |
| **Coverage check** | Guard at `stop`: if too few stages met their criteria, refuse to silently polish — offer three options instead | `references/synthesis.md:6-14` |
| **Confidence filter** | Sorting rule at synthesis: promote `[fact]`/`[human]`, drop guesses, carry `[unknown]`/`[inference]` into an explicit section | `references/synthesis.md:16-26` |
| **Control** | A one-word command the human steers with (`start`, `continue`, `deeper`, `skip`, `jump to`, `why`, `summarize`, `pause`, `stop`, `speedrun`) | `SKILL.md:247-265` |
| **`speedrun`** | A *standing* `continue` — runs the whole ladder without per-turn gates, at unchanged rigor | `SKILL.md:271-302` |
| **`pause` vs `stop`** | Deliberately different promises: `pause` = bookmark, **no** deliverable; `stop` = finish and synthesize | `SKILL.md:304-318` |

## How the entities relate

**[fact]** A **session** has one **goal** (`SKILL.md:30`) and one **repo type** (`SKILL.md:182`).
The type selects a **playbook**, which reorders the **ladder**. Each **stage** runs the **core loop**
once, must satisfy its **"done when"**, and emits one **trail file**. Every claim in a trail file
carries an **evidence tag**. At `stop`, the trail passes the **coverage check** and **confidence
filter** to become the **deliverable**, which is then embedded in the **study page**.

**[inference]** The evidence tag is the atomic unit of the whole domain — coverage check, confidence
filter, fog map, and the `[human]` correction protocol are all downstream of it. Remove tagging and
nothing else in the design has anything to operate on.
</script>

<script type="text/markdown" data-id="04-key-flows" data-label="04 · Key flows" data-group="trail">
# 04 · Key flows

## Flow A — a normal interactive session, end to end

No hand-waving; every waypoint is a real location.

1. **Trigger.** Claude Code matches the user's situation against the frontmatter `description`
   (`SKILL.md:2-10`). **[fact]** `README.md:110-112` states the mechanism: "The description is the
   only thing that makes a skill trigger", which is why it's written as a list of situations
   ("where do I start", "walk me through this repo", "a `.kt/` directory exists") rather than as a
   feature summary.
2. **Load.** The `SKILL.md` body (lines 12-347) enters context. `references/` do **not**.
3. **Goal question.** `SKILL.md:30-45` — ask *why* they're here, once, offering four framings
   (bug fix / ownership / due diligence / just understand). If the opening message already states
   it, infer and skip the turn. Never block on it.
4. **Announce `.kt/`.** `SKILL.md:~237` — tell the human the directory is being created and that
   they may want to gitignore it.
5. **Stage 1, Orientation.** Runs DISCOVER→EXPLAIN→ASSESS→PROPOSE→CONFIRM (`SKILL.md:47-56`) using
   the tool list at `SKILL.md:92-112` (`ls`, manifests, entry points, `git log`, grep, tests).
   Completion criterion at `SKILL.md:160-162`: purpose + stack + entry points + repo type, **all
   cited**.
6. **Branch on repo type.** `SKILL.md:182-188` → read `references/repo-playbooks.md`, follow one of
   the 14 playbooks (`repo-playbooks.md:32-360`). This is the first lazy load.
7. **Write the trail.** Stage output → `.kt/01-overview.md`; `.kt/00-progress.md` rewritten
   (`SKILL.md:~228-243` gives its exact shape: Goal · Repo type / Stages checklist / Open questions
   / Next step).
8. **Stop and wait.** Turn ends with the fog assessment, **one** proposal, and 2-3 relevant controls
   — not all ten (`SKILL.md:267-269`).
9. **Loop stages 2-7**, one per `continue`, each writing its numbered file.
10. **Exit.** `pause` → bookmark only (`SKILL.md:306-311`). `stop` → Flow B.

## Flow B — `stop` / end of speedrun → the two deliverables

1. `SKILL.md:313-318` → read `references/synthesis.md` before writing anything.
2. **Coverage check** (`synthesis.md:6-14`). If only a couple of stages met their criteria: do
   **not** generate a polished doc. Say what's covered, offer three options (synthesize anyway /
   keep exploring / pause). Proceed only on a clear yes.
3. **Confidence filter** (`synthesis.md:16-26`). Promote `[fact]`+`[human]` into the body; drop
   dead ends and pure guesses; carry every surviving `[unknown]` and unpromoted `[inference]` into
   an explicit **"Assumptions & things to verify with a human"** section. `synthesis.md:25` forbids
   the failure mode by name: "Never launder an inference into confident prose by dropping its tag."
4. **Write `08-onboarding.md`** in the 6-part shape at `synthesis.md:33-41`.
5. **Build the study page** (`synthesis.md:45-64`):
   - copy `references/study-page-template.html` → `.kt/onboarding.html`;
   - paste each trail file's **raw markdown verbatim** into its matching
     `<script type="text/markdown">` slot — `08` into `data-group="guide"`
     (`study-page-template.html:170`), `00`–`07` into the eight `data-group="trail"` slots
     (`study-page-template.html:174-204`);
   - **delete the slot for any file that doesn't exist** (`synthesis.md:57-58`) so a partial KT
     never renders empty sections;
   - set `<title>` (`study-page-template.html:36`) and `.kt-repo-name`
     (`study-page-template.html:146`); change nothing else.
6. **Announce both outputs by name**, noting the HTML opens in a browser with no server
   (`synthesis.md:62-64`).

## Flow C — how the study page renders (the repo's only runtime code)

**[fact]** `study-page-template.html:303` collects every
`document.querySelectorAll('script[type="text/markdown"]')` block, and `:322` builds one `<section
class="file">` per block, adding the `feature` class when `data-group="guide"`.
**[fact]** Markdown is rendered by a **hand-rolled renderer** — `esc()` at `:208`, `inline()` at
`:210`, `renderMarkdown()` at `:222`. There is no `marked`, no CDN, no external asset of any kind.
**[fact]** A filter input (`:148`) drives the nav (`:149`), with scroll-spy at `:352` toggling the
`active` class; `copy()` at `:340` has a `<textarea>` fallback (`:345`) for browsers without the
async clipboard API.
**[inference]** The `script[type="text/markdown"]` choice is what makes step 5 safe: the browser
never executes or parses those blocks, so arbitrary markdown pastes in unescaped. `synthesis.md:54-55`
names the single exception — a literal `<\/script>` must be written `<\/script>`.
</script>

<script type="text/markdown" data-id="05-dependencies" data-label="05 · Dependencies" data-group="trail">
# 05 · Dependencies & blast radius

## External dependencies

**[fact]** **Zero package dependencies.** No manifest, no lockfile, no vendored code, no CDN
reference. `study-page-template.html` is fully self-contained (see `.kt/04-key-flows.md`, Flow C).

The real dependencies are runtime and social, not packaged:

| Dependency | Nature | Failure behaviour |
|---|---|---|
| **Claude Code (or Claude.ai / Cowork)** | The host that loads and executes `SKILL.md`. The only "runtime". | **[fact]** If frontmatter parsing or skill discovery changes upstream, the skill silently never triggers — no error surfaces. `README.md:110-112` |
| **Skill-discovery convention** (`~/.claude/skills/<name>/`) | Install contract, `README.md:60-66` | **[inference]** Wrong path = skill absent with no diagnostic. The README's remedy is the manual check at `codebase-onboarding/README.md:65-67`: ask *"what skills do you have available?"* |
| **The agent's own tools** (`ls`, `git`, grep, file read) | Every DISCOVER step assumes them, `SKILL.md:92-112` | **[fact]** `SKILL.md:113-128` covers degraded cases explicitly: no git history, read-only/uploaded repo, huge monorepo, vendored dirs. |
| **The human's replies** | The controls, `SKILL.md:247-265` | **[fact]** `speedrun` removes this dependency for the duration of a run — hence the *stricter* read-only rule at `SKILL.md:~292`. |
| **`assets/*.png` via raw.githubusercontent.com** | `codebase-onboarding/README.md` bottom uses absolute raw URLs | **[inference]** Deliberate — that README renders correctly when the folder is copied out of the repo. The root `README.md:139-141` uses relative paths instead. |
| **[reference]** `mattpocock/skills` | Cited influence, `codebase-onboarding/README.md:376-379` | Credit only; nothing is imported. |

## Blast radius — "if I change X, what breaks?"

- **`SKILL.md` frontmatter `description`** — **highest blast radius in the repo.** **[fact]** It is
  the *only* thing that makes the skill trigger (`README.md:110-112`). Weaken it and the skill
  becomes dead code that nobody notices, because nothing errors.
- **`SKILL.md` body** — always in context, so every added line costs budget for the whole run.
  **[inference]** Growth here is the main pressure the `references/` split exists to relieve
  (`README.md:114-116`); moving material *out* is safe, adding material *in* is the expensive
  direction.
- **A "Done when" criterion** — **[fact]** `codebase-onboarding/README.md:330-331`: "If you add
  [a stage], give it a completion criterion — a stage without one gets declared done early."
  Deleting one silently shortens every future run.
- **`references/repo-playbooks.md`** — lowest blast radius. Playbooks are independent; adding #15
  affects only repos of that type. **[fact]** The one coupling is the Contents list at
  `repo-playbooks.md:13-31`, which must be updated alongside (`codebase-onboarding/README.md:326-328`).
- **`references/synthesis.md`** — affects only the final turn, but that's the turn that produces the
  artifact that outlives the session. A weakened coverage check (`synthesis.md:6-14`) reintroduces
  precisely the failure the whole skill exists to prevent.
- **`references/study-page-template.html`** — **[fact]** the slot IDs
  (`data-id`/`data-label`/`data-group`, lines 170-204) are a contract with `synthesis.md:52-53` and
  with the `.kt/` filenames in `SKILL.md:194-205`. Renaming a `.kt/` file means editing **three**
  files, and nothing checks the invariant.
- **`.gitignore:2` (`.kt/`)** — remove it and every future KT run starts committing its working trail
  into the user's repo.

## Known drift (this repo, today)

- **[fact]** `codebase-onboarding/README.md:62` still instructs users to "Upload
  `codebase-onboarding.skill`". No such file exists — the packaged bundle was deleted in `9a77940`,
  and commit `ce43ad1` fixed the *root* README's wording but not this one. Stale instruction.
- **[fact]** HEAD (`6e83541`) is titled "wip: readme preview — brand hero, badges, **mermaid
  ladder**", but `README.md` contains no mermaid block (`grep -n mermaid README.md` → no match).
  **[inference]** The ladder diagram was dropped or not yet added; the commit is marked `wip:`, so
  this is likely in-flight rather than a bug.
- **[fact]** Counts are duplicated in three places and currently agree: `README.md:14` badge
  (`Skills-1`), `README.md:100` and `codebase-onboarding/README.md:344` ("13 repo-type playbooks +
  generic fallback"), matching the 14 `##` headings in `repo-playbooks.md`. **[inference]** Nothing
  enforces this; adding a playbook or a skill means hand-editing every copy.
</script>

<script type="text/markdown" data-id="06-operations" data-label="06 · Operations" data-group="trail">
# 06 · Operations

## Build

**[fact]** There is none. No build script, no bundler, no generated output, no `dist/`. The source
files *are* the artifact. `README.md:29`: "No plugin, no config, no runtime."

## Deploy

**[fact]** "Deploy" = copy a folder (`README.md:58-66`, `codebase-onboarding/README.md:45-58`):

```bash
cp -r codebase-onboarding ~/.claude/skills/          # personal, all projects
cp -r codebase-onboarding <your-repo>/.claude/skills/ # project-level, checked in
```

Then restart Claude Code (`codebase-onboarding/README.md:56-57`).

**[fact]** The whole folder must be copied, not just `SKILL.md` — `README.md:58` and `README.md:84-86`
both warn that a skill missing `references/` "will be missing capability."

**[fact]** For Claude.ai / Cowork: zip the folder and upload under Settings → Capabilities → Skills
(`README.md:81-86`). See the stale `.skill` instruction noted in `.kt/05-dependencies.md`.

## Configuration

**[fact]** No config files. The only tunable surface is the prose itself —
`codebase-onboarding/README.md:324-335` lists the four supported customizations: add a playbook,
change the ladder, change the `.kt/` layout, tune the house style.

**[fact]** `.gitignore` (2 lines) is the sole repo-level setting; it ignores `.kt/`, the directory
this skill writes into the *user's* repo.

## Verification / test story

**[fact]** **There is no automated test or CI of any kind** — no `.github/`, no linter, no
link-checker, no markdown validation. This is the repo's most notable operational gap.

**[fact]** The only prescribed verification is manual and in-band
(`codebase-onboarding/README.md:65-67`): ask *"what skills do you have available?"* and confirm
`codebase-onboarding` is listed.

**[inference]** The de facto test suite is *running the skill on a real repo and reading the
output* — which is exactly what this session is. Nothing catches a broken cross-reference, a stale
line-number citation, or a drifted count until a run trips over it.

## Fragile spots

1. **Silent trigger failure.** **[fact]** Only the `description` triggers the skill
   (`README.md:110-112`) and nothing reports a non-trigger. A weakened description degrades the
   product invisibly.
2. **Un-enforced cross-file contracts.** **[fact]** `.kt/` filenames appear in `SKILL.md:194-205`,
   `synthesis.md:52-53`, and as `data-id` slots in `study-page-template.html:170-204`. Three copies,
   zero checks.
3. **Hardcoded counts drift.** See `.kt/05-dependencies.md` — badge and two prose counts, all
   hand-maintained.
4. **Context budget.** **[inference]** `SKILL.md` at 347 lines is always loaded. Every future rule
   added to it competes with the exploration itself for context; the `references/` escape hatch has
   to be used deliberately or the design erodes.
5. **[unknown]** Whether the skill behaves correctly in the Claude.ai/Cowork upload path (read-only
   mount, no `.git/`, `.kt/` relocation — `SKILL.md:118-121`). The logic is written; there is no
   evidence in the repo that it was exercised.
</script>

<script type="text/markdown" data-id="07-safe-contribution" data-label="07 · Safe contribution" data-group="trail">
# 07 · Safe contribution

## The house rules (non-negotiable, and short)

**[fact]** `README.md:120-129` states them:

1. Keep each skill **self-contained** in its own folder.
2. Write the `SKILL.md` description as **trigger conditions**, not a feature summary.
3. Push material only *some* runs need into `references/`, so `SKILL.md` stays lean.
4. Give any multi-stage process a checkable **"done when"** per stage.
5. Add a `README.md` for humans, and a row to the README table.

## Good first changes, lowest risk first

**Tier 1 — no behavioural risk at all**

- **Fix the stale install line.** `codebase-onboarding/README.md:62` tells users to upload
  `codebase-onboarding.skill`, which no longer exists (deleted in `9a77940`). The root README's
  correct wording is at `README.md:81-83` — mirror it. Human-docs only; the agent never reads this
  file.
- **Resolve the `wip:` mermaid gap.** HEAD claims a "mermaid ladder" in the README that isn't there.
  Either add the diagram or amend the intent.

**Tier 2 — additive, isolated**

- **Add a 15th repo-type playbook.** `codebase-onboarding/README.md:326-328` gives the recipe: copy
  an existing playbook, keep the five-part shape (recognition signals · ladder emphasis · files to
  read first · must-answer questions · traps), then **add it to the Contents list at
  `repo-playbooks.md:13-31`** and update the two "13 repo-type playbooks" strings
  (`README.md:100`, `codebase-onboarding/README.md:344`). Blast radius: repos of that type only.

**Tier 3 — touches always-loaded context; review carefully**

- **Editing `SKILL.md`.** Every line is loaded for every run. If you add a ladder stage, you must
  give it a completion criterion (`codebase-onboarding/README.md:330-331`), add its `.kt/` file to
  the layout at `SKILL.md:194-205`, add a slot to `study-page-template.html:170-204`, and mention it
  in `synthesis.md`. Four files.
- **Editing the frontmatter `description`.** Highest blast radius in the repo — see
  `.kt/05-dependencies.md`.

## How to run and verify a change

There is no test command to run. **[fact]** Verification is manual and behavioural:

```bash
# 1. Reinstall the edited folder
cp -r codebase-onboarding ~/.claude/skills/

# 2. Confirm the copy actually landed (should print nothing)
diff -r codebase-onboarding ~/.claude/skills/codebase-onboarding

# 3. Restart Claude Code, then ask:
#      "what skills do you have available?"        → codebase-onboarding must be listed
#      "walk me through this repo"                 → must trigger WITHOUT being named
#
# 4. Exercise the path you changed:
#      /codebase-onboarding            → one stage, then it must STOP and wait
#      /codebase-onboarding speedrun   → full ladder, then 08-onboarding.md + onboarding.html
#
# 5. Inspect the output, then reset:
open .kt/onboarding.html   # (macOS) — start .kt\onboarding.html on Windows
rm -rf .kt                 # .kt/ is gitignored (.gitignore:2); safe to delete and re-run
```

**[fact]** Step 2's `diff -r` is a real check — it was run during this session and confirmed the
repo and installed copies were byte-identical.

**[inference]** The highest-value check is step 3's *unnamed* trigger. A change that only ever gets
tested via `/codebase-onboarding` will never catch a broken `description`, which is the one failure
mode that fails silently.

## What not to do

**[fact]** `SKILL.md:130-148` binds the skill itself to read-only behaviour when exploring someone
else's repo: no source/config edits, no state-mutating commands, and **no running builds, tests, or
scripts** without the human's decision. When contributing *to* this repo, that rule is the product —
weakening it is the change most likely to make the skill harmful in the field.
</script>

<script>
/* ---- tiny, dependency-free markdown renderer (block + inline) ---- */
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function inline(s){
  s = esc(s);
  // code spans first, protected from other rules
  const spans=[]; s=s.replace(/`([^`]+)`/g,(m,c)=>{spans.push("<code>"+c+"</code>");return "\u0000"+(spans.length-1)+"\u0000";});
  s=s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  s=s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  s=s.replace(/(^|[^*])\*([^*]+)\*/g,"$1<em>$2</em>");
  s=s.replace(/\[(fact|inference|unknown|human)\]/g,'<span class="tag tag-$1">[$1]</span>');
  s=s.replace(/\u0000(\d+)\u0000/g,(m,i)=>spans[i]);
  return s;
}

function renderMarkdown(src){
  // normalise, pull out fenced code blocks
  const lines = src.replace(/\r\n?/g,"\n").split("\n");
  let html="", i=0;
  const flushList=(buf,ordered)=>{
    if(!buf.length) return "";
    const tag=ordered?"ol":"ul";
    return "<"+tag+">"+buf.map(x=>"<li>"+inline(x)+"</li>").join("")+"</"+tag+">";
  };
  let listBuf=[], listOrdered=false;
  const closeList=()=>{ if(listBuf.length){ html+=flushList(listBuf,listOrdered); listBuf=[]; } };

  while(i<lines.length){
    let ln=lines[i];

    // fenced code
    const fence=ln.match(/^```(.*)$/);
    if(fence){
      closeList();
      const lang=fence[1].trim(); const code=[]; i++;
      while(i<lines.length && !/^```/.test(lines[i])){ code.push(lines[i]); i++; }
      i++; // skip closing fence
      const raw=code.join("\n");
      const langLabel = lang ? '<span class="lang">'+esc(lang)+'</span>' : '';
      html+='<div class="codeblock">'+langLabel+
            '<button class="copy-btn" data-copy-code>Copy</button>'+
            '<pre><code>'+esc(raw)+'</code></pre>'+
            '<textarea hidden>'+esc(raw)+'</textarea></div>';
      continue;
    }

    // blank
    if(/^\s*$/.test(ln)){ closeList(); i++; continue; }

    // heading
    const h=ln.match(/^(#{1,6})\s+(.*)$/);
    if(h){ closeList(); const lvl=h[1].length; html+="<h"+lvl+">"+inline(h[2])+"</h"+lvl+">"; i++; continue; }

    // hr
    if(/^\s*([-*_])\1\1+\s*$/.test(ln)){ closeList(); html+="<hr>"; i++; continue; }

    // blockquote (collapse consecutive)
    if(/^\s*>\s?/.test(ln)){
      closeList(); const q=[];
      while(i<lines.length && /^\s*>\s?/.test(lines[i])){ q.push(lines[i].replace(/^\s*>\s?/,"")); i++; }
      html+="<blockquote>"+renderMarkdown(q.join("\n"))+"</blockquote>"; continue;
    }

    // table (GFM): header row + separator row of ---|---
    if(/\|/.test(ln) && i+1<lines.length && /^\s*\|?\s*:?-{2,}/.test(lines[i+1]) && /\|/.test(lines[i+1])){
      closeList();
      const cells=r=>r.replace(/^\s*\|?|\|?\s*$/g,"").split("|").map(c=>c.trim());
      const head=cells(ln); i+=2; const rows=[];
      while(i<lines.length && /\|/.test(lines[i]) && !/^\s*$/.test(lines[i])){ rows.push(cells(lines[i])); i++; }
      html+='<table><thead><tr>'+head.map(c=>"<th>"+inline(c)+"</th>").join("")+"</tr></thead><tbody>"+
            rows.map(r=>"<tr>"+r.map(c=>"<td>"+inline(c)+"</td>").join("")+"</tr>").join("")+"</tbody></table>";
      continue;
    }

    // lists
    const ul=ln.match(/^\s*[-*+]\s+(.*)$/);
    const ol=ln.match(/^\s*\d+[.)]\s+(.*)$/);
    if(ul||ol){
      const ordered=!!ol;
      if(listBuf.length && ordered!==listOrdered) closeList();
      listOrdered=ordered; listBuf.push((ul?ul[1]:ol[1])); i++; continue;
    }

    // paragraph (gather until blank / block starter)
    closeList();
    const para=[ln]; i++;
    while(i<lines.length && !/^\s*$/.test(lines[i]) && !/^(#{1,6}\s|```|\s*>|\s*[-*+]\s|\s*\d+[.)]\s)/.test(lines[i])
          && !/^\s*([-*_])\1\1+\s*$/.test(lines[i])){ para.push(lines[i]); i++; }
    html+="<p>"+inline(para.join(" "))+"</p>";
  }
  closeList();
  return html;
}

/* ---- build the page ---- */
(function(){
  const blocks=[...document.querySelectorAll('script[type="text/markdown"]')]
    .map(s=>({id:s.dataset.id,label:s.dataset.label,group:s.dataset.group,
              md:s.textContent.replace(/^\n/,"").replace(/\s+$/,"")}))
    .filter(b=>b.md && !/^<!--[\s\S]*-->$/.test(b.md.trim()));

  const nav=document.getElementById("nav");
  const content=document.getElementById("content");
  const groups=[["guide","Curated guide"],["trail","Working trail"]];
  const sections=[];

  groups.forEach(([g,glabel])=>{
    const gb=blocks.filter(b=>b.group===g);
    if(!gb.length) return;
    const gl=document.createElement("div"); gl.className="nav-group-label"; gl.textContent=glabel; nav.appendChild(gl);
    gb.forEach(b=>{
      const a=document.createElement("a"); a.href="#"+b.id; a.textContent=b.label;
      a.dataset.target=b.id; if(g==="guide") a.className="feature"; nav.appendChild(a);

      const sec=document.createElement("section");
      sec.className="file"+(g==="guide"?" feature":""); sec.id=b.id;
      sec.innerHTML=
        '<div class="file-bar"><span class="name">'+b.label+'</span>'+
        (g==="guide"?'<span class="badge">deliverable</span>':'<span class="badge">evidence</span>')+
        '<button class="copy-btn" data-copy-file>Copy markdown</button></div>'+
        '<div class="file-body md">'+renderMarkdown(b.md)+'</div>';
      sec.querySelector("[data-copy-file]").addEventListener("click",e=>copy(e.target,b.md));
      content.appendChild(sec); sections.push({id:b.id,label:b.label,el:sec,nav:a});
    });
  });

  if(!sections.length){ document.getElementById("empty").style.display="block"; }

  // per-code-block copy
  content.querySelectorAll("[data-copy-code]").forEach(btn=>{
    btn.addEventListener("click",()=>{ const ta=btn.parentElement.querySelector("textarea"); copy(btn,ta.value); });
  });

  function copy(btn,text){
    const done=()=>{ const t=btn.textContent; btn.textContent="Copied"; btn.classList.add("done");
      setTimeout(()=>{btn.textContent=t; btn.classList.remove("done");},1200); };
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done).catch(fallback); }
    else fallback();
    function fallback(){ const t=document.createElement("textarea"); t.value=text; document.body.appendChild(t);
      t.select(); try{document.execCommand("copy");}catch(e){} t.remove(); done(); }
  }

  // scroll-spy
  const spy=new IntersectionObserver(es=>{
    es.forEach(e=>{ if(e.isIntersecting){
      sections.forEach(s=>s.nav.classList.toggle("active",s.id===e.target.id)); } });
  },{rootMargin:"-45% 0px -50% 0px"});
  sections.forEach(s=>spy.observe(s.el));

  // filter
  document.getElementById("search").addEventListener("input",e=>{
    const q=e.target.value.trim().toLowerCase(); let any=false;
    sections.forEach(s=>{
      const hit=!q || s.label.toLowerCase().includes(q) || s.el.textContent.toLowerCase().includes(q);
      s.el.style.display=hit?"":"none"; s.nav.style.display=hit?"":"none"; if(hit) any=true;
    });
    document.getElementById("empty").style.display=any?"none":"block";
  });
})();
</script>
</body>
</html>
