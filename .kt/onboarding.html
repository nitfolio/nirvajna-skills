# Onboarding — `nirvajna-skills`

*Produced by a full-ladder KT session on 2026-07-27, against commit `2e94f1b` —
every `file:line` here is a line number at that commit. All seven stages met
their completion criteria; the working trail with the underlying evidence is in `.kt/00-progress.md`
through `07-safe-contribution.md`.*

---

## 1. What this system is

`nirvajna-skills` is a public repository of **Claude Code skills**. It ships exactly one: `onboard-me`,
a guided knowledge-transfer skill that walks an engineer through an unfamiliar codebase one stage at
a time, tagging every claim with its evidence.

The thing to internalise before reading anything: **there is no executable code here.** Thirteen
tracked source files — six Markdown/HTML documents, four PNGs, `LICENSE`, `.gitignore`, and an empty
`.nojekyll`. No build, no tests, no CI, no dependencies, no application config. A skill is "a
self-contained folder — a `SKILL.md` plus optional `references/`, `scripts/`, or `assets/` — that
Claude Code loads when the situation calls for it. No plugin, no config, no runtime"
(`README.md:27-29`). The repo is inert text; behaviour exists only when an agent loads it.

So the usual questions get unusual answers. *Architecture* means what gets loaded into context and
when. *Key flows* are paths through documents. *Operations* means build, CI, and config are all
essentially empty — and that `main` is production.

Since 2026-07-27 the repo is also **a published website**. GitHub Pages serves it from `main`, and
its one job is hosting the study page this skill produces, at
`https://nitfolio.github.io/nirvajna-skills/.kt/onboarding.html`.

Single author, 30 commits, 2026-07-08 to 2026-07-27, public on GitHub with no stars, forks, issues,
tags, or releases.

---

## 2. Architecture map

The organising principle is **progressive disclosure**: 362 lines always loaded, 812 lines loaded
only when a run reaches the stage that needs them.

```
nirvajna-skills/
├── README.md          168 L   front door — pitch, install, layout      (no runtime role)
├── LICENSE                    MIT                                       (no runtime role)
├── .gitignore           2 L   two comments, ZERO patterns               (no runtime role)
├── .nojekyll            0 L   empty; makes Pages publish .kt/           (no runtime role)
├── assets/                    4 PNGs, wordmark + logo, light/dark       (no runtime role)
├── .kt/                       this trail — committed, and published
└── onboard-me/                THE PRODUCT
    ├── SKILL.md       362 L   ── ALWAYS LOADED. The method.
    ├── README.md      439 L   ── humans only; nothing loads it at runtime
    └── references/            ── ON DEMAND
        ├── repo-playbooks.md         360 L
        ├── synthesis.md               76 L
        └── study-page-template.html  376 L
```

Modules "talk" through **a prose sentence naming a file path** — that is the entire dispatch
mechanism. No import graph, no config, no registry. Four edges, all originating in `SKILL.md`, none
pointing back:

```
                      SKILL.md
                (frontmatter = trigger)
                          |
        +-----------------+------------------+
        |                                    |
   :185 | at Orientation                :312 | at `stop`
        |                               :330 |
        v                                    v
 repo-playbooks.md                     synthesis.md
 (13 types + fallback)                       |
                                        :63  | "copy the template"
                                             v
                                   study-page-template.html
                                             |
                                             v
                                     .kt/onboarding.html
                                             |
                                             v
                                   GitHub Pages (published)
```

**Three couplings that nothing enforces** — the interesting part of this architecture:

1. **The HTML template is hard-coded to the evidence vocabulary.**
   `study-page-template.html:218` regex-matches `[fact|inference|unknown|human]` to colour the tags.
   Those four words are defined at `SKILL.md:74-82`. Rename one and the study page silently stops
   highlighting it — no error, no build step that would catch it.
2. **Unfilled slots hide themselves.** `study-page-template.html:314` drops any slot still holding
   its placeholder comment, so a partial KT degrades gracefully.
3. **Hosting depends on an empty file.** `.nojekyll` → Pages → `.kt/onboarding.html` → the README's
   PS link. Delete the empty file and the chain breaks silently.

The study page still makes **zero network requests**. Its one external reference is a `mermaid.live`
hyperlink at `study-page-template.html:251`, which fires only if a reader clicks it.

One deliberate asymmetry: the root README references `assets/` by relative path, the skill README by
absolute `raw.githubusercontent.com` URL — because `onboard-me/` is designed to be copied *out* of
the repo, where a relative path would resolve to nothing.

## 3. Domain glossary

Two vocabularies overlap. Confusing them is the main way a newcomer misreads the repo.

**Platform terms — Claude Code defines these, and they constrain what the repo may look like:**

| Term | Meaning | Home |
| --- | --- | --- |
| **Skill** | Self-contained folder Claude Code loads on demand | `README.md:27-29` |
| **`SKILL.md`** | The one required file; loaded whole when the skill triggers | `onboard-me/SKILL.md` |
| **`name`** | Skill identifier — must equal the containing directory name | `SKILL.md:2` |
| **`description` / trigger surface** | The *only* thing deciding whether a skill activates | `SKILL.md:3-10`, rule at `README.md:132-134` |
| **`references/`** | Files loaded lazily, only when a stage needs them | `onboard-me/references/` |
| **Progressive disclosure** | Keep `SKILL.md` lean; push heavy material into `references/` | `README.md:136-138` |

**Method terms — this skill invents these, and they constrain what a session does:**

| Term | Meaning | Home |
| --- | --- | --- |
| **KT** | Knowledge transfer: "I know nothing" → "I can safely make a change" | `SKILL.md:22-23` |
| **The core loop** | DISCOVER → EXPLAIN → ASSESS → PROPOSE → CONFIRM, once per turn | `SKILL.md:52-58` |
| **The ladder** | Seven stages, Orientation through Safe contribution | `SKILL.md:160-180` |
| **Completion criterion** | The checkable condition a stage must meet before being called done | `SKILL.md:155-158` |
| **Evidence tags** | `[fact]` (cited) · `[inference]` (reasoned, unconfirmed) · `[unknown]` (couldn't determine) · `[human]` (the engineer said so — strongest) | `SKILL.md:74-82` |
| **Fog of war** | The map of what's lit vs still dark; keeping it honest is "the skill's whole job" | `SKILL.md:25-28` |
| **The `.kt/` trail** | Findings written as stages complete, so work outlives the chat | `SKILL.md:190-208` |
| **Working trail (`00`–`07`)** | Raw, evidence-tagged, unpolished record | `SKILL.md:216-219` |
| **Deliverable (`08`)** | The clean reader-facing document, written only at `stop` | `SKILL.md:218-219` |
| **The diagram rule** | Text diagrams by default; mermaid only when the reader is on GitHub | `SKILL.md:210-214` |
| **Repo-type playbook** | Per-repo-kind adaptation of the ladder; 13 types + generic fallback | `references/repo-playbooks.md` |
| **Coverage check** | The `stop` guard against polishing a barely-explored repo | `synthesis.md:6-14` |
| **Confidence filter** | Promote `[fact]`/`[human]`, drop guesses, carry the rest into an explicit section | `synthesis.md:16-26` |
| **Speedrun** | Standing `continue`: whole ladder, no gate, *stricter* read-only | `SKILL.md:286-317` |

Ten single words drive a session (`SKILL.md:267-277`): `start` · `continue` · `speedrun` · `deeper` ·
`skip` · `jump to <topic>` · `why` · `summarize` · `pause` · `stop`. `pause` and `stop` are different
promises — `pause` bookmarks and generates nothing; `stop` produces the deliverable.

The dependency runs one way: tags feed the trail, the trail feeds the filter, the filter feeds the
deliverable. Nothing downstream can promote a claim the tag didn't license. **That is the whole trust
mechanism.**

## 4. Key flows

### Flow A — install → trigger → first stage

| # | Waypoint | Where |
| --- | --- | --- |
| 1 | `npx skills@latest add nitfolio/nirvajna-skills` — one canonical copy in `.agents/skills/`, symlinked into `.claude/skills/` and other agent dirs | `README.md:61`, `:64-67` |
| 2 | The `description` matches what the user says — or `/onboard-me` bypasses matching | `SKILL.md:3-10`; pattern at `README.md:88-92` |
| 3 | **One** goal question, before any exploration; skipped if the opening message states the goal, never blocking if unanswered | `SKILL.md:30-45` |
| 4 | Classify the repo, then read **one** playbook | `SKILL.md:182-188`; `repo-playbooks.md:3-6` |
| 5 | Announce `.kt/` *before* creating it | `SKILL.md:250-251` |
| 6 | Core loop, one stage per turn, gated on the stage's completion criterion | `SKILL.md:52-58`, `:160-180` |

Exit: `pause` (bookmark, nothing generated) or `stop` (Flow B).

Manual install alternative: `cp -r your-skill-name ~/.claude/skills/` — **the whole folder, not just
`SKILL.md`** (`README.md:74-81`), because `references/` must travel with it.

### Flow B — `stop` → two artifacts → rendered page → published site

| # | Waypoint | Where |
| --- | --- | --- |
| 1 | Read `synthesis.md` before writing a word | `SKILL.md:328-333` |
| 2 | **Coverage check** — thin exploration must not become a polished document | `synthesis.md:6-14` |
| 3 | **Confidence filter** — promote `[fact]`/`[human]`, drop guesses, carry the rest | `synthesis.md:16-26` |
| 4 | Write `08-onboarding.md` to the six-part shape | `synthesis.md:33-41` |
| 5 | Fill the template: raw markdown into 9 slots, delete slots for missing files, set `<title>` and `.kt-repo-name`, **change nothing else** | `synthesis.md:63-70`; slots at `study-page-template.html:171-205`, placeholders at `:36` and `:147` |
| 6 | Browser render: collect slots `:311-314` → group and build cards `:321-338` → markdown parser `:223-307` → colour tags `:218` → mermaid fence note `:250-252` → copy buttons `:334`, `:344-345` → scroll-spy `:358` → live filter `:365` | `study-page-template.html` |
| 7 | **Publish** — a push to `main` rebuilds GitHub Pages, serving the trail publicly | repo behaviour, not the skill |

### The correction flow — short, and the most important

When the human corrects a claim, three things happen in the *same* turn (`SKILL.md:87-90`): retag it
as `[human]`, fix the affected `.kt/` file, and ask what else the correction invalidates. The stated
reason: "A mental model built on a stale assumption gets more wrong the longer it stands."

## 5. Your first change

**Add a repo-type playbook.** The repo asks for exactly this at `onboard-me/README.md:343-345`.

It is the safest real change because a new playbook section is inert until the Orientation classifier
selects it, and `SKILL.md:186-188` names the covered categories generically rather than by number —
so adding one cannot break an existing run, and it touches none of the three silent couplings.

**Work in** `onboard-me/references/repo-playbooks.md`. Copy an existing playbook (e.g. `:130-152`)
and keep all five parts: `Recognize it` · `Ladder emphasis` · `Read first` · `The KT must answer` ·
`Traps`. Keep the generic fallback last — `:347` is numbered 14 because it is the "nothing fits" case.

**Then update six hand-synced places**, because nothing keeps them in agreement:

| File | Line |
| --- | --- |
| `onboard-me/references/repo-playbooks.md` | `13-28` (contents list) |
| `README.md` | `48` |
| `README.md` | `118` |
| `onboard-me/README.md` | `14` (badge URL) |
| `onboard-me/README.md` | `207-210` |
| `onboard-me/README.md` | `361` |

### How to verify

There is no test command — nothing here builds, tests, or lints. Verification is a consistency sweep
plus one real run.

```bash
# 1 — structural checks, from the repo root
head -3 onboard-me/SKILL.md                                    # expect: name: onboard-me
grep -c '^## [0-9]' onboard-me/references/repo-playbooks.md    # expect: 14 (13 + fallback)
grep -rn 'repo-type playbooks\|repo types\|Repo_playbooks-' --include=*.md .
grep -c 'data-id=' onboard-me/references/study-page-template.html   # expect: 9
test -f .nojekyll && echo "present" || echo "MISSING — Pages will drop .kt/"

# the silent coupling — these two lists must name the same four tags
grep -n '^- \*\*\[' onboard-me/SKILL.md
grep -n 'fact|inference|unknown|human' onboard-me/references/study-page-template.html
```

```bash
# 2 — if you edited SKILL.md, synthesis.md, or the template, the trail's
#     citations have shifted. Check a sample still resolves.
grep -rho 'SKILL\.md:[0-9]*\(-[0-9]*\)\?' .kt/*.md | sort -u
sed -n '218p' onboard-me/references/study-page-template.html
```

```bash
# 3 — the real end-to-end test: run the skill
cp -r onboard-me <some-scratch-repo>/.claude/skills/
# then in Claude Code inside that repo:
/onboard-me
```

Confirm in order: it asks the goal question once, names the playbook it loaded, announces `.kt/`
before creating it, and on `stop` produces both `08-onboarding.md` and `onboarding.html`. A new
playbook is only exercised if the scratch repo actually *is* that type.

```bash
# 4 — check the study page renders (self-contained, no server)
start .kt/onboarding.html      # macOS: open   ·   Linux: xdg-open
```

**Commit convention:** imperative, sentence-case subject, no prefix — "Add a Rust workspace playbook".
Single branch `main`.

### What to avoid on a first change

- **Editing `SKILL.md:3-10`, the `description`.** Sole trigger surface; failure mode is a skill that
  silently stops firing.
- **Deleting `.nojekyll`.** It looks like junk and is not — removing it unpublishes `.kt/`.
- **Renaming anything.** Three things must move together — the directory, `SKILL.md:2`'s `name`, and
  every installed copy. Installed junctions/symlinks break invisibly.
- **Renaming a `.kt/` file or an evidence tag.** Both drift silently against the HTML template.

### Know before you push

**`main` is production twice over.** The install command carries no ref, and GitHub Pages rebuilds
from `main` on every push. With 0 tags and 0 releases there is nothing to roll back to, and no CI
stands between a commit and either consumer. Pages takes a couple of minutes to rebuild, so a stale
page right after a push is expected.

Other easy starting points: the wordmark width mismatch (`README.md:6` says `640`,
`onboard-me/README.md:6` says `565`), the Pages site root that currently 404s, or an entirely new
skill folder (`README.md:144-151`).

## 6. Assumptions & things to verify with a human

Everything above is drawn from `[fact]` claims with citations. These are not.

### Inferences — reasoned, not confirmed

- **The Library/SDK classification is soft.** It fits the shape (no server, explicit public surface,
  installed into other projects) but none of the signals (no registry metadata, `examples/`,
  CHANGELOG, or tests). The "library" is a prompt. Stages 4–6 leaned on the generic fallback's
  anchors instead.
- **The runtime is Claude Code itself.** Based on `README.md:27-29` plus nothing in the tree being
  executable. No file states it outright.
- **The relative-vs-absolute asset path split is deliberate**, because the skill folder is designed
  to be copied out of the repo. No comment says so.
- **Prose edits to `SKILL.md` fail soft** — the file is interpreted by a model, not parsed, so
  wording changes shift behaviour by degrees. The dangerous edits are structural. Based on there
  being no parser, schema, or test anywhere.
- **The commit stamp, not tooling, is the answer to citation drift.** `[human]` — the author's call,
  and it holds up: a citation is a line number at a known snapshot, so drift becomes a versioning
  question rather than a wrong claim. A checker script was written and removed the same day; it only
  caught citations pointing past end-of-file, and none of the ~15 real errors did. Checking that a
  line *exists* is not enough — all 97 were in range while ~15 pointed at the wrong content. Reading
  the targets is the check that works.
- **Bus factor 1** — 30 commits, one author, no CI, no reviewers.
- **`[human]` outranks `[fact]`** in the confidence filter. Implied by the tag definitions and the
  promotion rule; never stated explicitly.

### Unknowns — genuinely unresolved

- **Is the Pages site discoverable at all?** The root 404s and the study-page URL appears only in the
  skill README's PS. Nothing links it from the repo front door.
- **Does Claude Code *enforce* `name:` == directory name, or merely convention it?** A platform
  behaviour; needs the Claude Code docs, not this repo.
- **Has `npx skills@latest add nitfolio/nirvajna-skills` ever run successfully against this repo?**
  The package is real (npm `skills` v1.5.20) and the command well-formed, but nothing records a
  verified install.
- **What does "nirvajna" mean, and why was it chosen?** It appears only in the repo name and URLs —
  never in a document body.
- **Does branch protection or any GitHub-side setting exist?** Not visible from the repo.
- **How does the author package a `.skill` bundle?** No script is tracked, and no release asset has
  ever existed here.
- **PRs or issues first?** `README.md:144` welcomes both; there is no `CONTRIBUTING.md`, no PR
  template, and no PR history to infer a convention from.

### One caveat about this document

<script type="text/markdown" data-id="02-architecture" data-label="02 · Architecture" data-group="trail">
# 02 · Architecture

*Written against commit `2e94f1b` on 2026-07-27. Every `file:line` below is a line number **at that commit** — check that commit out to verify a claim, or re-run the skill to regenerate the trail against current source.*

## The shape

There is no runtime, so "architecture" here means **what gets loaded into an agent's context, and
when**. Everything else is documentation for humans, brand assets, or hosting plumbing.

The organising principle is **progressive disclosure**: a lean always-loaded file plus heavier files
pulled in only when a run needs them (`README.md:136-138`).

## Top-level entries

Every one is accounted for — none left unexplored.

| Entry | What it is | Runtime role |
| --- | --- | --- |
| `onboard-me/` | The one skill | **The entire product** |
| `README.md` | Repo front door — pitch, skills table, install, layout | None |
| `onboard-me/README.md` | Human usage docs for the skill | **None** — never loaded by the agent |
| `.kt/` | This trail; committed on purpose, and published via Pages | None (it is *output*) |
| `assets/` | 4 PNGs (wordmark + logo, light/dark each) | None |
| `LICENSE` | MIT | None |
| `.gitignore` | Two comment lines, zero patterns | None |
| `.nojekyll` | Empty file; makes Pages publish `.kt/` | None — but load-bearing for hosting |

[fact] `.gitignore` ignores nothing. Both lines are a comment explaining that `.kt/` is committed on
purpose.

[fact] `.nojekyll` has zero bytes of content. Its *existence* is the entire signal.

## Inside the skill

```
onboard-me/
├── SKILL.md          362 L  ── ALWAYS LOADED. The method.
├── README.md         439 L  ── humans only; no runtime edge points at it
└── references/              ── ON DEMAND
    ├── repo-playbooks.md         360 L
    ├── synthesis.md               76 L
    └── study-page-template.html  376 L
```

[fact] 362 lines always loaded vs 812 lines on demand — the heavy 69% of the skill stays out of
context until a run reaches the stage that needs it.

[fact] `SKILL.md` has 17 top-level sections, from "What this skill is for" (`:15`) to "Example of one
good turn" (`:341`).

## How the pieces talk

The dispatch mechanism is **a prose sentence naming a file path**. There is no import graph, no
config, no registry — an instruction like "read `references/repo-playbooks.md`" *is* the call.

```
                      SKILL.md
                (frontmatter = trigger)
                          |
        +-----------------+------------------+
        |                                    |
   :185 | at Orientation                :312 | at `stop`
        |                               :330 |
        v                                    v
 repo-playbooks.md                     synthesis.md
 (13 types + fallback)                       |
                                        :63  | "copy the template"
                                             v
                                   study-page-template.html
                                             |
                                             v
                                     .kt/onboarding.html
                                             |
                                             v
                                   GitHub Pages (published)
```

- [fact] `SKILL.md:185` → `references/repo-playbooks.md`, during Stage 1 Orientation.
- [fact] `SKILL.md:312` and `SKILL.md:330` → `references/synthesis.md`, at `stop` / end of speedrun.
- [fact] `synthesis.md:63` → `references/study-page-template.html`, the only second-hop edge.
- [fact] All edges are one-way and originate in `SKILL.md`. No reference file points back.
- [fact] `onboard-me/README.md` is referenced by nothing at runtime — documentation *about* the
  skill, never loaded *by* it.

## The one external URL

[fact] `study-page-template.html:251` now contains a single external reference:

```
'<a href="https://mermaid.live" target="_blank" rel="noopener">mermaid.live</a>, '+
```

[fact] This is a **hyperlink, not a fetch** — the page still requests nothing over the network, so
the self-contained/offline guarantee (`SKILL.md:207`, `:329`, `synthesis.md:59`, `:64-65`) is intact.

[fact] `SKILL.md`, `repo-playbooks.md`, and `synthesis.md` contain **zero** URLs (grep count 0 for
each). Everything the agent loads is fully self-contained.

## Two couplings that nothing enforces

These are the interesting part of this architecture, because no test, build, or schema protects them.

**1. The HTML template is hard-coded to `SKILL.md`'s evidence vocabulary.**

[fact] `study-page-template.html:218`:

```js
s=s.replace(/\[(fact|inference|unknown|human)\]/g,'<span class="tag tag-$1">[$1]</span>');
```

Those four words are defined at `SKILL.md:74-82`. [fact] Rename or add a tag there and the study page
silently stops highlighting it — no error, just unstyled text.

**2. Unfilled slots hide themselves.**

[fact] `study-page-template.html:314`:

```js
.filter(b=>b.md && !/^<!--[\s\S]*-->$/.test(b.md.trim()));
```

Any slot still holding its `<!-- PASTE … -->` placeholder is dropped at render time, so
`synthesis.md:68-69`'s "delete the slot" instruction is belt-and-braces rather than load-bearing.

[fact] There are 9 slots, at `study-page-template.html:171-205`, keyed by `data-id` — `08-onboarding`
in the `guide` group and `00`–`07` in the `trail` group.

## A third coupling, new today: hosting

[fact] `.nojekyll` → GitHub Pages → `.kt/onboarding.html` → the link in `onboard-me/README.md`'s PS.
Deleting the empty `.nojekyll` breaks that chain silently: Pages resumes skipping dot-directories,
`.kt/` disappears from the site, and the README link 404s. Nothing in the repo warns about this
except this trail.

## The asset path split

[fact] The two READMEs reference the same PNGs differently:

- `README.md:4-6`, `:161-163` — relative (`assets/wordmark-dark.png`)
- `onboard-me/README.md:4-6`, `:421-423` — absolute `raw.githubusercontent.com/...` URLs

[inference] Deliberate. The `onboard-me/` folder is designed to be copied *out* of the repo
(`README.md:78-81`), where a relative `../assets/` path would resolve to nothing. Based on the
install instructions; no comment explains it.

[fact] Cosmetic inconsistency, noted not fixed: the wordmark is `width="640"` in `README.md:6` but
`width="565"` in `onboard-me/README.md:6`. `da19904` enlarged only the root.

- [unknown] Nothing enforces the `name:`/directory match, the tag-vocabulary coupling, or the
  `.nojekyll` dependency. Whether the author has any checking process outside the repo is not
  visible from here.

<script type="text/markdown" data-id="03-domain-glossary" data-label="03 · Domain glossary" data-group="trail">
# 03 · Domain glossary

*Written against commit `2e94f1b` on 2026-07-27. Every `file:line` below is a line number **at that commit** — check that commit out to verify a claim, or re-run the skill to regenerate the trail against current source.*

Two vocabularies overlap here. **Platform terms** come from Claude Code and constrain what the repo
may look like. **Method terms** are invented by this skill and constrain what a KT session does.
Confusing the two is the main way a newcomer misreads the repo.

## Platform terms (Claude Code defines these)

| Term | One-line meaning | Lives in |
| --- | --- | --- |
| **Skill** | A self-contained folder Claude Code loads on demand — `SKILL.md` plus optional `references/`, `scripts/`, `assets/`. No plugin, no config, no runtime. | `README.md:27-29` |
| **`SKILL.md`** | The one required file. Its body is the instructions; loaded in full whenever the skill triggers. | `onboard-me/SKILL.md` |
| **Frontmatter** | The YAML block carrying `name` and `description`. | `SKILL.md:1-11` |
| **`name`** | The skill's identifier. Must equal the containing directory name. | `SKILL.md:2` |
| **`description` / trigger surface** | The *only* thing that decides whether a skill activates — written as a list of situations, not a feature summary. | `SKILL.md:3-10`; rule at `README.md:132-134` |
| **`references/`** | Files loaded lazily, only when a run reaches the stage that needs them. | `onboard-me/references/` |
| **Progressive disclosure** | Keep `SKILL.md` lean enough to stay in context all session; push heavy material into `references/`. | `README.md:136-138` |

## Method terms (this skill defines these)

| Term | One-line meaning | Lives in |
| --- | --- | --- |
| **KT** | Knowledge transfer — moving someone from "I know nothing" to "I can safely make a change". | `SKILL.md:13`, `:22-23` |
| **The core loop** | The fixed five-beat shape of every turn: DISCOVER → EXPLAIN → ASSESS → PROPOSE → CONFIRM. | `SKILL.md:52-58` |
| **The ladder** | The seven-stage default exploration order, Orientation → Safe contribution. | `SKILL.md:160-180` |
| **Stage** | One rung. Exactly one per turn, except in a speedrun. | `SKILL.md:49-50` |
| **Completion criterion** | The checkable condition that must hold before a stage may be called done — the guard against declaring "Architecture complete" after a folder listing. | `SKILL.md:155-158` |
| **Evidence tag** | The label on every non-obvious claim: `[fact]`, `[inference]`, `[unknown]`, `[human]`. | `SKILL.md:74-82` |
| **`[fact]`** | Directly supported by something read, *with a citation*. No citation → not a fact. | `SKILL.md:74-75` |
| **`[inference]`** | A reasonable deduction, not confirmed; must state what it rests on. | `SKILL.md:76-77` |
| **`[unknown]`** | Couldn't determine it. Treated as valuable output, not failure. | `SKILL.md:78-79` |
| **`[human]`** | The engineer said so — the strongest evidence in the room, treated as settled. | `SKILL.md:80-82` |
| **Fog of war** | The map of what's lit vs what's still dark. Keeping it honest is "the skill's whole job". | `SKILL.md:25-28` |
| **Zone of proximal development** | How the next step is chosen — just beyond current knowledge and reachable from it, not the most interesting thing found. | `SKILL.md:60-63` |
| **The `.kt/` trail** | The directory of findings written as stages complete, so work outlives the chat. | `SKILL.md:190-208` |
| **Working trail (`00`–`07`)** | Raw, evidence-tagged, unpolished record of the learning. | `SKILL.md:216-219` |
| **Deliverable (`08-onboarding.md`)** | The clean reader-facing document, written only at `stop`. | `SKILL.md:218-219` |
| **`00-progress.md`** | The resumability file — kept current every turn so a fresh session picks up exactly where the last stopped. | `SKILL.md:226-243` |
| **The diagram rule** | Draw diagrams in text by default; mermaid renders on GitHub but the study page ships no renderer, so a mermaid fence appears there as source. | `SKILL.md:210-214`; `synthesis.md:36-37` |
| **Repo-type playbook** | A per-repo-kind adaptation of the ladder: recognition signals, ladder emphasis, files to read first, must-answer questions, traps. 13 types + a generic fallback. | `references/repo-playbooks.md` |
| **Coverage check** | The `stop`-time guard against polishing a barely-explored repo into a confident document. | `references/synthesis.md:6-14` |
| **Confidence filter** | The `stop`-time sort: promote `[fact]`/`[human]`, drop guesses, carry surviving `[unknown]`/`[inference]` into an explicit "Assumptions & things to verify" section. | `references/synthesis.md:16-26` |
| **Study page** | `onboarding.html` — one self-contained offline page bundling `00`–`08`, with per-file copy buttons. | `references/synthesis.md:57-76` |
| **Speedrun** | A standing `continue`: the whole ladder end to end with no per-turn gate, same rigor, *stricter* read-only. | `SKILL.md:286-317` |

## The controls

[fact] Ten single words drive a session, listed once at `SKILL.md:267-277` and mirrored for humans at
`onboard-me/README.md:132-143`:

`start` · `continue`/`yes` · `speedrun` · `deeper` · `skip` · `jump to <topic>` · `why` ·
`summarize` · `pause` · `stop`

[fact] `pause` and `stop` are deliberately different promises — `pause` bookmarks and generates
nothing; `stop` produces the deliverable (`SKILL.md:319-333`).

## How the terms relate

```
Skill (platform)
  └── SKILL.md ── description ──> triggers the session
                    │
                    └── the method:
                          core loop  ──runs once per──>  stage
                                                          │
                                          stage ──gated by──> completion criterion
                                          stage ──adapted by──> repo-type playbook
                                          stage ──emits──>  evidence-tagged claims
                                                                  │
                                                      claims ──written to──> .kt/ working trail (00–07)
                                                                                    │
                                                        at `stop`: coverage check ──┤
                                                                confidence filter ──┤
                                                                                    v
                                                              08-onboarding.md + onboarding.html
```

[fact] The dependency runs one way: tags feed the trail, the trail feeds the filter, the filter feeds
the deliverable. Nothing downstream can promote a claim the tag didn't license — that is the whole
trust mechanism.

## Naming

[fact] The repo is named `nirvajna-skills` (`c09418a` renamed it from `claude-skills-repo`). No file
in the repo defines, explains, or uses the word "nirvajna" — a full-text search finds it only in the
repo name and in URLs.

[fact] The brand is "Oops!... AI Did It Again", carried by the wordmark alt text (`README.md:6`) and
the site link `oopsaididitagain.com` (`README.md:16`).

## Open unknowns

- [unknown] What "nirvajna" means or why it was chosen — not answerable from the repo.

# 04 · Key flows

*Written against commit `2e94f1b` on 2026-07-27. Every `file:line` below is a line number **at that commit** — check that commit out to verify a claim, or re-run the skill to regenerate the trail against current source.*

Nothing executes, so a "flow" here is a path through *documents* — but it is a real, traceable path
with waypoints, and the same discipline applies: every waypoint carries a `file:line`.

Two flows matter. Flow A is what a user does. Flow B is what the skill does at the end, and it is
where the only real machinery lives. Flow B gained a publishing step on 2026-07-27.

---

## Flow A — install → trigger → first stage

**Waypoint 1. Install.** [fact] `README.md:61`:

```bash
npx skills@latest add nitfolio/nirvajna-skills
```

[fact] `README.md:64-67` describes the result: one canonical copy in `.agents/skills/`, symlinked
into `.claude/skills/` and every other agent directory found, so Codex/Cursor/Gemini CLI read the
same source. `-g` installs for the user, `--copy` writes real files instead of symlinks.

[fact] Manual alternative at `README.md:78-81`: `cp -r your-skill-name ~/.claude/skills/` (personal) or
into `<your-repo>/.claude/skills/` (project-level). The instruction stresses **the whole folder, not
just `SKILL.md`** (`README.md:74`) — `references/` must travel with it.

**Waypoint 2. Trigger.** [fact] `SKILL.md:3-10`. The `description` is matched against what the user
says, written as situations rather than features — "where do I start", "walk me through this repo",
due diligence, reverse-engineering a legacy system, resuming an in-progress KT. [fact] It closes with
an explicit override: "Prefer this over ad-hoc 'explain this code' whenever the goal is understanding
a whole system rather than one snippet."

[fact] An explicit invocation — `/onboard-me` — bypasses matching entirely. `README.md:88-92`
documents the pattern generically, showing `/your-skill-name` rather than this skill's own name.

**Waypoint 3. The goal question.** [fact] `SKILL.md:30-45`. Exactly one question, before any
exploration, with four options that reweight the ladder. [fact] `:42-45` gives two escape hatches: if
the opening message already states the goal, don't spend a turn asking; if the human doesn't answer,
assume "just understand it" and continue — never block.

**Waypoint 4. Classify, then load the playbook.** [fact] `SKILL.md:182-188` — classify during
Orientation, then read `references/repo-playbooks.md` and follow **one** playbook.
[fact] `repo-playbooks.md:3-6` reinforces it: follow the dominant type, don't read all of them; if
the repo is a mix, name the pieces and make the rest `jump to` targets.

**Waypoint 5. Announce the trail, then write it.** [fact] `SKILL.md:250-251` — tell the human `.kt/`
is being created *before* creating it, and mention they may want to gitignore it.

**Waypoint 6. Loop.** [fact] `SKILL.md:52-58` — DISCOVER → EXPLAIN → ASSESS → PROPOSE → CONFIRM, one
stage per turn, then stop and wait. [fact] A stage may only be called done when its completion
criterion (`SKILL.md:160-180`) is met.

Exit: `pause` (bookmark, no deliverable — `SKILL.md:323-326`) or `stop` (Flow B).

### The speedrun variant

[fact] `SKILL.md:286-317`. The gate at CONFIRM is removed and nothing else changes. Two clauses are
load-bearing:

- [fact] `:305-307` — read-only gets **stricter**, not looser: "Autonomy removes the human who would
  have approved running a build, test, or script, so in a speedrun you never run them."
- [fact] `:308-310` — genuine forks still stop the run (a monorepo needing scoping, a destructive
  action, evidence contradicting the stated goal).

---

## Flow B — `stop` → two artifacts → rendered page → published site

**Waypoint 1.** [fact] `SKILL.md:328-333` — before writing a word, read `references/synthesis.md`.

**Waypoint 2. Coverage check.** [fact] `synthesis.md:6-14`. If only a couple of stages met their
criteria, do **not** silently generate a polished document — it "manufactures exactly the artifact
this skill exists to prevent, and it will outlive the session and be believed by people who weren't
here." Offer three options: synthesize anyway, keep exploring, or pause.

**Waypoint 3. Confidence filter.** [fact] `synthesis.md:16-26`. Sort every claim:

- **Promote** `[fact]` and `[human]` into the body as settled statements.
- **Drop** dead ends and anything that was only ever a guess.
- **Carry** every surviving `[unknown]` and unpromoted `[inference]` into an explicit
  "Assumptions & things to verify with a human" section.

[fact] `:25-26`: "Never launder an inference into confident prose by dropping its tag."

**Waypoint 4. Write `08-onboarding.md`.** [fact] Six-part shape at `synthesis.md:33-41`: what this
system is · architecture map · domain glossary · one or two key flows · your first change ·
assumptions & things to verify. [fact] `:43-44` sets the acceptance test — readable start to finish
by someone who never ran the skill and has no access to the chat.

[fact] Part 2 now carries the diagram rule (`synthesis.md:36-37`): draw the architecture map in text
by default, because the study page ships no mermaid renderer.

**Waypoint 5. Build `onboarding.html`.** [fact] `synthesis.md:63-70`, four steps:

1. Copy `references/study-page-template.html` to `.kt/onboarding.html`.
2. Paste each file's **raw markdown verbatim** into its slot — `08` fills the `guide` slot, `00`–`07`
   the `trail` slots. Blocks are inert so no escaping is needed, with one exception: a literal
   closing script tag in the markdown must be escaped.
3. Delete the slot for any `.kt/` file that doesn't exist.
4. Set the `<title>` and the `.kt-repo-name` span to the repo name. **Change nothing else.**

[fact] The slots are at `study-page-template.html:171-205` — nine of them, keyed by `data-id`.
[fact] The two `REPO_NAME` placeholders are at `:36` (title) and `:147` (sidebar span).

**Waypoint 6. Render — in the browser, no server.** [fact] The page's own pipeline:

| Step | Where |
| --- | --- |
| Collect every markdown slot, strip leading newline | `:311-314` |
| Drop slots still holding their placeholder comment | `:314` |
| Group into "Curated guide" (08) and "Working trail" (00–07) | `:321-324` |
| Build a nav link + a `<section>` card per file | `:325-338` |

| Per-file "Copy markdown" button | `:334` |

| Live filter over files and headings | `:365` |

**Waypoint 7. Publish (new, 2026-07-27).** [fact] Not part of the skill — a property of this repo.
Pushing to `main` triggers a GitHub Pages build, which serves the trail at
`https://nitfolio.github.io/nirvajna-skills/.kt/onboarding.html`. [fact] The `onboard-me/README.md`
PS links that URL, so the deliverable is reachable by anyone, not just whoever ran the session.

[fact] `synthesis.md:75-76` — announce both outputs by name and mention the HTML opens straight in a
browser, no server needed.

---

## The correction flow (short, and the most important one)

[fact] `SKILL.md:87-90`. When the human corrects a claim, three things happen in the **same turn**:
retag it as `[human]`, fix the affected `.kt/` file, and ask whether the correction invalidates
anything else already said. [fact] The stated rationale: "A mental model built on a stale assumption
gets more wrong the longer it stands."

[inference] This is the only inbound edge into the trail from outside the repo, which is why
`[human]` outranks `[fact]` in the filter at `synthesis.md:20`. Based on the tag definitions at
`SKILL.md:80-82` and the promotion rule; no file states the ranking explicitly.

<script type="text/markdown" data-id="05-dependencies" data-label="05 · Dependencies" data-group="trail">
# 05 · Dependencies & blast radius

*Written against commit `2e94f1b` on 2026-07-27. Every `file:line` below is a line number **at that commit** — check that commit out to verify a claim, or re-run the skill to regenerate the trail against current source.*

## External dependencies

There is no dependency manifest, so these were found by reading, not by resolving a lockfile.

| Dependency | Where it enters | What happens if it fails or changes |
| --- | --- | --- |
| **Claude Code** (the runtime) | The whole premise; format described at `README.md:27-29` | If the skill format changes — frontmatter keys, directory-name matching, `references/` loading — the skill stops triggering. Nothing in the repo would report it; it just goes quiet. |
| **`skills` CLI** (npm, `vercel-labs/skills`) | `README.md:61`, described at `:64-67` | [fact] Verified: npm `skills` **v1.5.20**, repo `github.com/vercel-labs/skills`. The documented primary install path. If its layout changes, the install prose goes stale — the skill itself is unaffected, since `cp -r` still works. |
| **GitHub Pages** *(new 2026-07-27)* | Hosts the study page; linked from `onboard-me/README.md`'s PS | [fact] Enabled from `main` at root, `build_type: legacy`, HTTPS enforced, status `built`. If a build fails or Pages is disabled, the README's study-page link 404s. |
| **`.nojekyll`** | Empty file at the repo root | [fact] Without it Jekyll skips dot-prefixed paths and `.kt/` is never published. Deleting it silently unpublishes the trail. See blast radius #2. |
| **GitHub raw + blob URLs** | 10 hardcoded `nitfolio` URLs, **all in `onboard-me/README.md`** | Renaming the repo or owner breaks every image and link in the skill's README wherever it renders outside GitHub. |
| **img.shields.io** | 4 badges in `README.md`, 4 in `onboard-me/README.md` | Badges break; nothing functional. One encodes a fact that can go stale (`Repo_playbooks-13`, `onboard-me/README.md:14`). |
| **oopsaididitagain.com** | `README.md:16`, `:166`; `onboard-me/README.md:21` | Dead link only. |
| **mermaid.live** *(new)* | `study-page-template.html:251` | [fact] A hyperlink in the mermaid fence note, not a fetch. If the site disappears the link dies; the page still renders offline exactly as before. |
| **Browser Clipboard API** | `study-page-template.html:348-355` | [fact] Already handled — falls back to a hidden `<textarea>` + `execCommand`. |

[fact] **`SKILL.md`, `repo-playbooks.md`, and `synthesis.md` contain zero URLs** (grep count 0 for
each). Everything the agent loads is self-contained — a run works with no network, and the skill
survives being copied anywhere.

[fact] The study page makes **no network requests**. Its single external reference is the
`mermaid.live` hyperlink, which fires only if a reader clicks it.

## Repo state (verified 2026-07-27, commit `2e94f1b`)

[fact] Public · 0 stars · 0 forks · 0 open issues · 0 releases · 0 tags · 30 commits · one author ·
`has_pages: true`.

[fact] Consequence: no `.skill` release asset exists and never has in this repo's lifetime
(`9a77940` removed the committed bundle). Any doc telling a user to download one points at nothing.

[fact] Consequence: no external adoption signal exists. The answer is "nobody yet", not "unmeasured".

## Blast radius — what breaks if I change this

Ordered by how much damage a careless edit does.

### 1. `SKILL.md:3-10` — the `description` — **highest**

[fact] It is the only trigger surface (`README.md:132-134`). Narrow it and the skill stops firing on
cases it used to catch; broaden it and it hijacks unrelated conversations. [fact] The failure is
**silent and invisible from the repo** — nothing tests it, and a skill that stopped triggering is
noticed only by its absence.

### 2. Deleting `.nojekyll` — **the newest and sneakiest**

[fact] It is an **empty file with no visible purpose**, which makes it exactly what a tidy-up
deletes. Removing it makes GitHub Pages resume skipping dot-prefixed paths, `.kt/` vanishes from the
published site, and the study-page link in `onboard-me/README.md`'s PS 404s.

[fact] Nothing warns about this — no comment in the file (it has none), no note in either README.
Only this trail records it.

### 3. Renaming the skill — **three places, one of them off-disk**

[fact] Demonstrated by `00b7dd3` (`codebase-onboarding` → `onboard-me`). Three things must move:

1. The directory `onboard-me/`.
2. `SKILL.md:2`'s `name:` — the platform requires it to match the directory.
3. **Every already-installed copy.** [fact] On this machine `~/.claude/skills/onboard-me` is a
   Windows *junction* into this repo, not a copy; a `git mv` leaves it dangling.

[fact] Point 3 is invisible from inside the repo and undocumented in it. The `skills` CLI uses
symlinks elsewhere (`README.md:64-67`), so the hazard is not Windows-specific. Also in scope: the 10
hardcoded GitHub URLs in `onboard-me/README.md`.

### 4. The evidence-tag vocabulary — **silent cosmetic break**

[fact] `SKILL.md:74-82` defines the four tags; `study-page-template.html:218` hard-codes exactly
those four in a regex. Rename one or add a fifth and every study page renders it as plain text, with
no error. Nothing links the two files.

### 5. The `.kt/` file names or numbering — **breaks the study page**

[fact] `study-page-template.html:171-205` has 9 slots keyed by `data-id`. [fact] `SKILL.md:196-208`
and `onboard-me/README.md:227-239` document the same list. Renaming a `.kt/` file means editing three
files, one of them HTML.

[fact] Partial mitigation: `:314` drops any slot that is still an unfilled comment, so a *missing*
file degrades gracefully. A *renamed* one does not — its content simply never appears.

### 6. Editing any file the trail cites — **the repo's most active failure mode**

[fact] The `.kt/` trail cites `file:line` throughout. Editing `SKILL.md`, `synthesis.md`, or the
template shifts those lines and silently invalidates the citations. [fact] On 2026-07-27 this
happened **four separate times in one day** — the Diagrams paragraph moved `SKILL.md` by 6 lines
from `:210`, the synthesis shape list by 1 from `:37`, the template by 8, and a mid-session README
edit shifted both READMEs — each requiring a sweep of ~20 citations.

[fact] Worse, a systematic audit of all 97 citations found roughly **15 that were wrong before any
of today's edits**. They were inherited from an earlier run and never re-verified after the install
section was rewritten in `047333c`. Examples: `onboard-me/README.md:190-193` pointed at mermaid
`classDef` lines instead of the "Covered:" list (correct: `207-210`); `README.md:128-130` pointed at
a `<summary>` tag instead of the description rule (correct: `132-134`);
`study-page-template.html:215` pointed one line off the tag regex.

[fact] Every one of these is *in range* — the cited line exists. Only reading the target reveals the
error, which is why an existence check is not enough.

[human] Resolved by the author: **stamp each `.kt/` file with the commit it was written against.**
A citation is then a line number at a known snapshot — a reader checks out that commit to verify, or
regenerates the trail. Drift stops being wrongness and becomes a versioning question.

[fact] A `scripts/check-citations.py` was written, tested, and then removed on 2026-07-27. It only
hard-failed citations pointing *past the end* of a file; all ~15 real errors were in range and passed
it silently. What caught them was reading the target lines, which `grep` and `sed` do without adding
a Python dependency, executable code, or an exception to the read-only boundary — all of which cut
against the skill's "no plugin, no config, no runtime" claim (`README.md:27-29`).

### 7. Adding or removing a repo-type playbook — **5 stale counters**

[fact] The number `13` is stated in five places, hand-synced: `README.md:48`, `README.md:118`,
`onboard-me/README.md:14` (badge), `:207-210`, `:361`. Plus the contents list at
`repo-playbooks.md:13-28`, numbered 1–14 (13 types + generic fallback). [fact] All six currently
agree — checked this session.

### 8. Adding a ladder stage — **needs a completion criterion**

[fact] `onboard-me/README.md:346-347`: "If you add one, give it a completion criterion — a stage
without one gets declared done early." A new stage likely wants a new `.kt/` file, dragging in #5.

### 9. Prose in `SKILL.md` generally — **cheap**

[inference] The file is loaded whole and interpreted by a model rather than parsed, so most edits
fail soft — wording shifts behaviour by degrees. Based on there being no parser, schema, or test
anywhere. The dangerous edits are the structural ones above.

## What has no blast radius at all

[fact] `assets/`, `LICENSE`, and `.gitignore` are inert — nothing the agent loads points at them.
Editing them cannot change how a KT session behaves.

## Open unknowns

- [unknown] Whether Claude Code *enforces* `name:` == directory name, or merely conventions it. A
  platform behaviour, not answerable from this repo.
- [unknown] Whether `npx skills@latest add nitfolio/nirvajna-skills` has ever run successfully
  against this repo.
- [unknown] Whether anything other than the skill README's PS links the published Pages site.

# 06 · Operations

*Written against commit `2e94f1b` on 2026-07-27. Every `file:line` below is a line number **at that commit** — check that commit out to verify a claim, or re-run the skill to regenerate the trail against current source.*

## Build

[fact] **There is none.** No `package.json`, `pyproject.toml`, `go.mod`, `Cargo.toml`, or `Makefile`
— each checked individually. Nothing compiles, bundles, or generates. The files in the repo are the
artifact.

[fact] No test suite. No linter. No formatter config. No pre-commit hooks in the tree.

## CI

[fact] **There is none.** No `.github/` directory at all — no workflows, no PR checks.

[fact] The one automated process is **GitHub Pages**, which builds on push. It is hosting, not CI:
it never validates anything and cannot fail a bad change.

[fact] Consequence: every consistency rule here is enforced by hand. Nothing checks that
`SKILL.md:2`'s `name` matches the directory, that the five playbook counters agree, that the study
page's tag regex still matches the tag vocabulary, that `.kt/` citations still resolve, or that the
two READMEs tell the same story.

## Deploy / distribution

[fact] **`main` is production, and it deploys on push — now along two paths at once.**

| Path | Where documented | What it reads |
| --- | --- | --- |
| `npx skills@latest add nitfolio/nirvajna-skills` | `README.md:61` | The repo at **`main`** — no ref, tag, or version |
| `cp -r your-skill-name ~/.claude/skills/` | `README.md:78-81` | Whatever the user has checked out |
| Zip / `.skill` upload to claude.ai or Cowork | `README.md:99-103`, `onboard-me/README.md:74-78` | A hand-made archive |
| **GitHub Pages** *(new)* | `onboard-me/README.md` PS | **`main`** at repo root, rebuilt on every push |

[fact] The 10 asset and link URLs in `onboard-me/README.md` are likewise pinned to `/main/`.

[fact] There are **0 tags and 0 releases**. No version, no changelog, no pinning, nothing to roll
back to. A bad push is live immediately for installers *and* for the website; the only remedy is
another push.

[fact] The `.skill` bundle is *not* a build output — no such file is tracked, and `9a77940`
deliberately removed the one that used to be. It is packaged ad hoc when someone needs it.

## GitHub Pages

[fact] Enabled 2026-07-27 from `main` at the repo root. `build_type: legacy`, HTTPS enforced, status
`built`. Site: `https://nitfolio.github.io/nirvajna-skills/`.

[fact] Its only purpose is to serve the study page at
`https://nitfolio.github.io/nirvajna-skills/.kt/onboarding.html`, linked from the PS at the end of
`onboard-me/README.md`.

[fact] It requires the empty `.nojekyll` at the repo root — Jekyll skips paths beginning with a dot,
so without it `.kt/` would never be published. Verified: with `.nojekyll` present, Pages serves
`.kt/onboarding.html` as `200 text/html` and `.kt/08-onboarding.md` as `200 text/markdown`.

[fact] The site root returns **404** — there is no `index.html`. Only the deep link is advertised.

[fact] Builds are not instant. Observed on 2026-07-27: roughly a couple of minutes from push to the
new content being served, during which the old page is still live.

## Configuration

[fact] Almost none. The only tracked config is the empty `.nojekyll` marker — no build config, no
linter config, no CI config, no application config.

[fact] `.claude/settings.local.json` exists on this machine but is untracked, has one top-level key
(`permissions`), and is ignored by the *user's global* gitignore (`~/.config/git/ignore:1`) rather
than by this repo. A local Claude Code preference file, not project config.

[fact] `.gitignore` contains two comment lines and **zero patterns**. Everything in the working tree
is committed by default — deliberately, so `.kt/` ships as a worked example.

[fact] No secrets exist in this repo — no `.env`, no credentials, no tokens, no keys. The only
sensitive-ish surface is the untracked `.claude/settings.local.json`, inspected for shape only.

## The one runtime "environment"

[inference] The nearest thing to a deployment target is the user's skills directory. On this machine
`~/.claude/skills/onboard-me` is a **Windows junction** into this repo, so edits here are live in
every session with no install step. Based on the junction observed during the `00b7dd3` rename, when
`git mv` broke it and it had to be recreated.

[fact] The `skills` CLI does the same with symlinks elsewhere (`README.md:64-67`). Operational
consequence: **a rename or move silently breaks installed links**, invisibly from inside the repo.
`--copy` trades liveness for immunity.

## Fragile spots

Named plainly, worst first.

1. **Citation drift in `.kt/`.** [fact] The trail cites `file:line` throughout, and editing any cited
   file silently invalidates them. Observed **three times on 2026-07-27 alone** — `SKILL.md` +6 from
   `:210`, `synthesis.md` +1 from `:37`, the template +8 — each needing a ~20-citation sweep. [fact]
   One citation was wrong from the moment it was written (`template:215`; the regex was at `:217`).
   Nothing checks this.
2. **Deleting `.nojekyll`.** [fact] An empty file with no visible purpose; removing it unpublishes
   `.kt/` and 404s the README's study-page link, with no error anywhere.
3. **Doc drift between the two READMEs.** [fact] Already happened twice: `363b5ff` changed the
   install path in `README.md` only, leaving `onboard-me/README.md` recommending `cp -r` and a
   non-existent `onboard-me.skill`. Both corrected in `047333c`.
4. **Five hand-synced playbook counters.** [fact] `README.md:48`, `:118`,
   `onboard-me/README.md:14`, `:207-210`, `:361` — all currently agree; nothing keeps them that way.
5. **Tag vocabulary ↔ study-page regex.** [fact] `SKILL.md:74-82` vs
   `study-page-template.html:218`. Drift fails silently and cosmetically.
6. **Installed junctions/symlinks break on rename.** Undocumented in the repo.
7. **`main` has no safety net.** [fact] No CI, no tags, no releases, no protected branch, and both
   the installer and the website read `main` — there is no gap between "committed" and "shipped".
8. **Bus factor 1.** [inference] 30 commits, one author, no CI, no reviewers.

## Conventions worth matching

[fact] Commit subjects are imperative, sentence-case, no prefix or scope — "Rename the
codebase-onboarding skill to onboard-me", "Add .nojekyll so GitHub Pages publishes the dot-prefixed
.kt/ directory". One exception across all 30: `6e83541` "wip: readme preview - brand hero, badges,
mermaid ladder".

[fact] Single branch `main`; every commit is on it. No merge commits, no PR history.

## Open unknowns

- [unknown] Whether branch protection or other GitHub-side settings exist — not visible from the
  repo, and not covered by the API fields checked.
- [unknown] How the author packages a `.skill` bundle when one is needed. No script is tracked.

# 07 · Safe contribution

*Written against commit `2e94f1b` on 2026-07-27. Every `file:line` below is a line number **at that commit** — check that commit out to verify a claim, or re-run the skill to regenerate the trail against current source.*

## The house rules

[fact] `README.md:144-151` states them for anyone adding a skill:

- Keep it **self-contained** in its own folder.
- Write the `SKILL.md` description as **trigger conditions**, not a summary of features.
- Push reference material that only some runs need into `references/`, so `SKILL.md` stays lean.
- Give any multi-stage process a checkable **"done when"** condition per stage — "vague criteria are
  the single most common reason a skill stops early."
- Add a `README.md` for humans, and a row to the skills table.

[fact] `onboard-me/README.md:341-350` adds four ways to extend the existing skill: add a repo type,
change the ladder, change the `.kt/` layout, tune the house style.

## Recommended first change: add a repo-type playbook

[fact] The repo invites exactly this at `onboard-me/README.md:343-345`.

**Why it's the safest real change:**

[fact] A new playbook section is inert until the Orientation classifier picks it. `SKILL.md:186-188`
names the covered categories generically ("backend services, monorepos, frontends…") and does not
enumerate them by number, so adding a 14th type cannot break an existing run.

[inference] It also cannot reach any of the three silent couplings in `02-architecture.md` — it
touches neither the evidence-tag vocabulary, nor the `.kt/` filenames, nor `.nojekyll`. Based on
those couplings living in `SKILL.md:74-82`, `study-page-template.html:171-205`, and the repo root;
none of which a playbook edits.

**Where to work:** `onboard-me/references/repo-playbooks.md`.

**Keep the shape.** [fact] Every existing playbook has the same five parts — copy one (e.g.
`:130-152`) and fill them in:

1. `**Recognize it:**` — the signals that classify a repo as this type
2. `**Ladder emphasis:**` — where depth goes, and what "key flows" means for this kind of system
3. `**Read first:**` — the files worth opening before anything else
4. `**The KT must answer:**` — the questions a newcomer to this system always ends up asking
5. `**Traps:**` — the ways a KT of this type goes wrong

[fact] `repo-playbooks.md:8-11` explains why parts 2 and 4 exist: a playbook adapts the ladder but
never replaces the core loop, the evidence tags, or the artifacts; and the must-answer list is the
exit criterion for a good KT of that type, with unanswered items going to `00-progress.md` as
`[unknown]`.

**Then update the counters.** [fact] Five hand-synced places plus the contents list:

| File | Line | What to change |
| --- | --- | --- |
| `onboard-me/references/repo-playbooks.md` | `13-28` | Add the new number to the contents list |
| `README.md` | `48` | "Adapts to 13 repo types" |
| `README.md` | `118` | Layout tree comment |
| `onboard-me/README.md` | `14` | The `Repo_playbooks-13` badge URL |
| `onboard-me/README.md` | `207-210` | The prose list of covered types |
| `onboard-me/README.md` | `361` | Files tree comment |

[fact] Keep the generic fallback last — `repo-playbooks.md:347` is numbered 14 precisely because it
is the "nothing fits" case.

## How to verify it

There is no test command. [fact] Nothing in the repo builds, tests, or lints — so verification is a
consistency sweep plus one real run. **I did not run any of these** (`SKILL.md:305-307`: a speedrun
never executes commands); they are for you.

### 1. Structural checks (seconds, from the repo root)

```bash
# frontmatter name must equal the directory name
head -3 onboard-me/SKILL.md          # expect: name: onboard-me

# playbook count: numbered sections vs every claimed counter
grep -c '^## [0-9]' onboard-me/references/repo-playbooks.md   # expect: 14
grep -rn 'repo-type playbooks\|repo types\|Repo_playbooks-' --include=*.md .

# the silent coupling: tag vocabulary must match the study-page regex

<script>
/* ---- tiny, dependency-free markdown renderer (block + inline) ---- */
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function inline(s){
  s = esc(s);
  // code spans first, protected from other rules
  const spans=[]; s=s.replace(/`([^`]+)`/g,(m,c)=>{spans.push("<code>"+c+"</code>");return "\u0000"+(spans.length-1)+"\u0000";});
  s=s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  s=s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  s=s.replace(/(^|[^*])\*([^*]+)\*/g,"$1<em>$2</em>");
  s=s.replace(/\[(fact|inference|unknown|human)\]/g,'<span class="tag tag-$1">[$1]</span>');
  s=s.replace(/\u0000(\d+)\u0000/g,(m,i)=>spans[i]);
  return s;
}

function renderMarkdown(src){
  // normalise, pull out fenced code blocks
  const lines = src.replace(/\r\n?/g,"\n").split("\n");
  let html="", i=0;
  const flushList=(buf,ordered)=>{
    if(!buf.length) return "";
    const tag=ordered?"ol":"ul";
    return "<"+tag+">"+buf.map(x=>"<li>"+inline(x)+"</li>").join("")+"</"+tag+">";
  };
  let listBuf=[], listOrdered=false;
  const closeList=()=>{ if(listBuf.length){ html+=flushList(listBuf,listOrdered); listBuf=[]; } };

  while(i<lines.length){
    let ln=lines[i];

    // fenced code
    const fence=ln.match(/^```(.*)$/);
    if(fence){
      closeList();
      const lang=fence[1].trim(); const code=[]; i++;
      while(i<lines.length && !/^```/.test(lines[i])){ code.push(lines[i]); i++; }
      i++; // skip closing fence
      const raw=code.join("\n");
      const langLabel = lang ? '<span class="lang">'+esc(lang)+'</span>' : '';
      // This page ships no diagram renderer on purpose — it must stay offline and
      // self-contained. Mermaid fences show as source, so say so and point somewhere useful.
      const note = /^mermaid$/i.test(lang)
        ? '<div class="fence-note">Diagram source — this page renders no diagrams. Copy it into '+
          '<a href="https://mermaid.live" target="_blank" rel="noopener">mermaid.live</a>, '+
          'or read this file on GitHub, which renders mermaid natively.</div>'
        : '';
      html+='<div class="codeblock">'+langLabel+
            '<button class="copy-btn" data-copy-code>Copy</button>'+
            '<pre><code>'+esc(raw)+'</code></pre>'+note+
            '<textarea hidden>'+esc(raw)+'</textarea></div>';
      continue;
    }

    // blank
    if(/^\s*$/.test(ln)){ closeList(); i++; continue; }

    // heading
    const h=ln.match(/^(#{1,6})\s+(.*)$/);
    if(h){ closeList(); const lvl=h[1].length; html+="<h"+lvl+">"+inline(h[2])+"</h"+lvl+">"; i++; continue; }

    // hr
    if(/^\s*([-*_])\1\1+\s*$/.test(ln)){ closeList(); html+="<hr>"; i++; continue; }

    // blockquote (collapse consecutive)
    if(/^\s*>\s?/.test(ln)){
      closeList(); const q=[];
      while(i<lines.length && /^\s*>\s?/.test(lines[i])){ q.push(lines[i].replace(/^\s*>\s?/,"")); i++; }
      html+="<blockquote>"+renderMarkdown(q.join("\n"))+"</blockquote>"; continue;
    }

    // table (GFM): header row + separator row of ---|---
    if(/\|/.test(ln) && i+1<lines.length && /^\s*\|?\s*:?-{2,}/.test(lines[i+1]) && /\|/.test(lines[i+1])){
      closeList();
      const cells=r=>r.replace(/^\s*\|?|\|?\s*$/g,"").split("|").map(c=>c.trim());
      const head=cells(ln); i+=2; const rows=[];
      while(i<lines.length && /\|/.test(lines[i]) && !/^\s*$/.test(lines[i])){ rows.push(cells(lines[i])); i++; }
      html+='<table><thead><tr>'+head.map(c=>"<th>"+inline(c)+"</th>").join("")+"</tr></thead><tbody>"+
            rows.map(r=>"<tr>"+r.map(c=>"<td>"+inline(c)+"</td>").join("")+"</tr>").join("")+"</tbody></table>";
      continue;
    }

    // lists
    const ul=ln.match(/^\s*[-*+]\s+(.*)$/);
    const ol=ln.match(/^\s*\d+[.)]\s+(.*)$/);
    if(ul||ol){
      const ordered=!!ol;
      if(listBuf.length && ordered!==listOrdered) closeList();
      listOrdered=ordered; listBuf.push((ul?ul[1]:ol[1])); i++; continue;
    }

    // paragraph (gather until blank / block starter)
    closeList();
    const para=[ln]; i++;
    while(i<lines.length && !/^\s*$/.test(lines[i]) && !/^(#{1,6}\s|```|\s*>|\s*[-*+]\s|\s*\d+[.)]\s)/.test(lines[i])
          && !/^\s*([-*_])\1\1+\s*$/.test(lines[i])){ para.push(lines[i]); i++; }
    html+="<p>"+inline(para.join(" "))+"</p>";
  }
  closeList();
  return html;
}

/* ---- build the page ---- */
(function(){
  const blocks=[...document.querySelectorAll('script[type="text/markdown"]')]
    .map(s=>({id:s.dataset.id,label:s.dataset.label,group:s.dataset.group,
              md:s.textContent.replace(/^\n/,"").replace(/\s+$/,"")}))
    .filter(b=>b.md && !/^<!--[\s\S]*-->$/.test(b.md.trim()));

  const nav=document.getElementById("nav");
  const content=document.getElementById("content");
  const groups=[["guide","Curated guide"],["trail","Working trail"]];
  const sections=[];

  groups.forEach(([g,glabel])=>{
    const gb=blocks.filter(b=>b.group===g);
    if(!gb.length) return;
    const gl=document.createElement("div"); gl.className="nav-group-label"; gl.textContent=glabel; nav.appendChild(gl);
    gb.forEach(b=>{
      const a=document.createElement("a"); a.href="#"+b.id; a.textContent=b.label;
      a.dataset.target=b.id; if(g==="guide") a.className="feature"; nav.appendChild(a);

      const sec=document.createElement("section");
      sec.className="file"+(g==="guide"?" feature":""); sec.id=b.id;
      sec.innerHTML=
        '<div class="file-bar"><span class="name">'+b.label+'</span>'+
        (g==="guide"?'<span class="badge">deliverable</span>':'<span class="badge">evidence</span>')+
        '<button class="copy-btn" data-copy-file>Copy markdown</button></div>'+
        '<div class="file-body md">'+renderMarkdown(b.md)+'</div>';
      sec.querySelector("[data-copy-file]").addEventListener("click",e=>copy(e.target,b.md));
      content.appendChild(sec); sections.push({id:b.id,label:b.label,el:sec,nav:a});
    });
  });

  if(!sections.length){ document.getElementById("empty").style.display="block"; }

  // per-code-block copy
  content.querySelectorAll("[data-copy-code]").forEach(btn=>{
    btn.addEventListener("click",()=>{ const ta=btn.parentElement.querySelector("textarea"); copy(btn,ta.value); });
  });

  function copy(btn,text){
    const done=()=>{ const t=btn.textContent; btn.textContent="Copied"; btn.classList.add("done");
      setTimeout(()=>{btn.textContent=t; btn.classList.remove("done");},1200); };
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done).catch(fallback); }
    else fallback();
    function fallback(){ const t=document.createElement("textarea"); t.value=text; document.body.appendChild(t);
      t.select(); try{document.execCommand("copy");}catch(e){} t.remove(); done(); }
  }

  // scroll-spy
  const spy=new IntersectionObserver(es=>{
    es.forEach(e=>{ if(e.isIntersecting){
      sections.forEach(s=>s.nav.classList.toggle("active",s.id===e.target.id)); } });
  },{rootMargin:"-45% 0px -50% 0px"});
  sections.forEach(s=>spy.observe(s.el));

  // filter
  document.getElementById("search").addEventListener("input",e=>{
    const q=e.target.value.trim().toLowerCase(); let any=false;
    sections.forEach(s=>{
      const hit=!q || s.label.toLowerCase().includes(q) || s.el.textContent.toLowerCase().includes(q);
      s.el.style.display=hit?"":"none"; s.nav.style.display=hit?"":"none"; if(hit) any=true;
    });
    document.getElementById("empty").style.display=any?"none":"block";
  });
})();
</script>
